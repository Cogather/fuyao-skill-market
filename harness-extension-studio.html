<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Harness · 能力库 / 关系配置 / Extension 组装（原型）</title>
<style>
:root{
  --text:#667085; --text-h:#101828; --bg:#f3f5f9; --panel:#fff;
  --border:#e4e7ec; --code-bg:#f7f8fa;
  --accent:#2f7df6; --accent-2:#2563eb; --accent-bg:rgba(47,125,246,.09); --accent-border:rgba(47,125,246,.28);
  --skill:#2f7df6; --command:#16a34a; --agent:#7552ff;
  --warn:#b45309; --danger:#dc2626; --ok:#16a34a;
  --shadow:0 12px 32px rgba(16,24,40,.08); --shadow-sm:0 2px 8px rgba(16,24,40,.06); --shadow-pop:0 24px 60px rgba(16,24,40,.22);
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --sans:system-ui,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;
  --mono:ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--text);background:var(--bg);letter-spacing:.002em;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
h1,h2,h3,h4{margin:0;color:var(--text-h);font-weight:700}
p{margin:0}
.app{height:100vh;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(circle at 80% -12%,rgba(47,125,246,.08),transparent 34%),var(--bg)}
.topbar{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 18px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
.brand{width:30px;height:30px;border-radius:8px;background:linear-gradient(145deg,#4290ff,#246fe5);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.brand-stack{display:flex;flex-direction:column}
.brand-k{color:#98a2b3;font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}
.brand-t{color:var(--text-h);font-size:13px;font-weight:700}
.mode-tabs{display:flex;gap:3px;margin-left:8px;padding:3px;border:1px solid var(--border);border-radius:8px;background:#f7f8fa}
.mode-tab{border:0;background:transparent;color:var(--text);font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px}
.mode-tab.active{background:var(--panel);color:var(--accent);box-shadow:var(--shadow-sm)}
.spacer{flex:1}
.sel{height:30px;border:1px solid var(--border);border-radius:7px;background:var(--panel);color:var(--text-h);font-size:12px;font-weight:600;padding:0 9px;outline:none}
.sel:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text-h);font-size:10px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:5px 11px;border:1px solid transparent;border-radius:7px;font-size:12px;font-weight:600;color:var(--text-h);background:var(--panel);transition:transform .15s,box-shadow .15s,border-color .15s,background .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{border-color:#dfe3e8}
.btn-ghost:hover:not(:disabled){border-color:var(--accent-border);background:#f6f9ff}
.btn-primary{background:linear-gradient(135deg,#3b87f7,#276fdf);color:#fff;box-shadow:0 4px 10px rgba(47,125,246,.18)}
.btn-soft{border-color:#dfe3e8;background:#f6f9ff;color:#2868c7}
.btn-success{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 4px 10px rgba(22,163,74,.2)}
.btn-danger{border-color:#fca5a5;background:#fff;color:var(--danger)}
.btn-sm{min-height:26px;padding:3px 9px;font-size:11px;border-radius:6px}
.btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.body{flex:1;min-height:0;overflow:auto}
.hidden{display:none!important}

/* config tabs */
.cfg-tabs{display:flex;gap:4px;padding:10px 18px 0;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.cfg-tab{border:0;background:transparent;color:var(--text);font-size:12px;font-weight:600;padding:8px 13px;border-bottom:2px solid transparent;white-space:nowrap}
.cfg-tab:hover{color:var(--text-h)}
.cfg-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.cfg-wrap{padding:16px 18px 40px;max-width:1400px;margin:0 auto}
.cfg-hero{margin-bottom:14px}
.cfg-hero h1{font-size:18px;font-weight:800}
.cfg-hero p{font-size:12px;color:#667085;margin-top:3px}
.cfg-placeholder{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pc-card{border:1px solid var(--border);border-radius:var(--r-md);background:var(--panel);box-shadow:var(--shadow-sm);padding:16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.pc-card:hover{border-color:var(--accent-border);box-shadow:var(--shadow);transform:translateY(-2px)}
.pc-ico{width:36px;height:36px;border-radius:9px;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:17px}
.pc-card h3{font-size:13px}
.pc-card p{font-size:11px;color:#98a2b3;line-height:1.5}
.pc-tag{font-size:10px;font-weight:700;color:var(--ok);background:rgba(22,163,74,.1);padding:2px 7px;border-radius:5px;align-self:flex-start}
.pc-tag.new{color:#6d3bd6;background:#f6f2ff}

/* generic list tools */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{position:relative;flex:1;min-width:160px}
.search input{width:100%;height:30px;padding:0 9px 0 26px;border:1px solid var(--border);border-radius:7px;background:var(--panel);font-size:12px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:13px;height:13px;fill:none;stroke:#98a2b3;stroke-width:2}
.type-chips{display:flex;gap:4px;flex-wrap:wrap}
.type-chip{padding:3px 8px;border:1px solid var(--border);border-radius:6px;background:var(--panel);font-size:10px;font-weight:600;color:var(--text)}
.type-chip.active{border-color:var(--accent-border);background:var(--accent-bg);color:var(--accent)}
.tool-spacer{flex:1}
.intro{font-size:11px;color:#475467;background:#f6f9ff;border:1px solid #e0e6f0;border-radius:8px;padding:9px 11px;margin-bottom:12px;line-height:1.6}
.intro b{color:#2868c7}

/* capability card (能力库定义) */
.cap-card{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--panel);box-shadow:var(--shadow-sm);margin-bottom:8px}
.cap-card .info{flex:1;min-width:0}
.cap-card .nm{font-size:13px;font-weight:700;color:var(--text-h);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cap-card .ref{font-size:9px;font-weight:600;color:#6d3bd6;background:#f6f2ff;padding:1px 6px;border-radius:4px;border:1px solid #e4d8fb}
.cap-card .ds{font-size:11px;color:#667085;margin:4px 0 7px;line-height:1.5}
.cap-card .meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:10px;color:#98a2b3}
.ctr{display:inline-flex;align-items:center;gap:4px;color:#475467;font-size:10px;font-weight:700}
.ctr select{height:22px;font-size:10px;border:1px solid var(--border);border-radius:5px;background:var(--panel);color:var(--text-h);padding:0 3px;outline:none}
.vers{display:inline-flex;align-items:center;gap:3px;flex-wrap:wrap}
.vchip{font:9px var(--mono);color:var(--text-h);background:#f7f8fa;border:1px solid var(--border);padding:1px 5px;border-radius:4px}
.addver{border:1px solid var(--border);background:var(--panel);color:var(--accent);width:18px;height:18px;border-radius:4px;font-size:12px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.addver:hover{border-color:var(--accent-border);background:var(--accent-bg)}
.cap-actions{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.type-tag{width:24px;height:24px;border-radius:6px;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.type-tag.skill{background:var(--skill)}
.type-tag.command{background:var(--command)}
.type-tag.agent{background:var(--agent)}
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:5px;font-size:9px;font-weight:700}
.status-badge .d{width:5px;height:5px;border-radius:50%}
.sb-plan{background:#eef2ff;color:#4266d5}.sb-plan .d{background:#4266d5}
.sb-dev{background:#fff3df;color:#b06a18}.sb-dev .d{background:#f59e0b}
.sb-live{background:#eaf8f1;color:#27815d}.sb-live .d{background:#16a34a}
.empty{padding:30px;text-align:center;color:#98a2b3;font-size:12px;border:1px dashed var(--border);border-radius:10px;background:#fbfcff}

/* relation config */
.rel-pickers{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--panel);box-shadow:var(--shadow-sm)}
.rel-pickers .lbl{font-size:11px;font-weight:700;color:#475467}
.rel-pickers .sel{min-width:200px}
.rel-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media(max-width:820px){.rel-cols{grid-template-columns:1fr}}
.rel-col{border:1px solid var(--border);border-radius:10px;background:var(--panel);box-shadow:var(--shadow-sm);overflow:hidden}
.rel-col-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border-bottom:1px solid #eef0f3;background:#f7f8fa}
.rel-col-head h3{font-size:12px;font-weight:700}
.rel-col-head .sub{font-size:10px;color:#98a2b3}
.rel-col-body{padding:8px;max-height:460px;overflow-y:auto}
.pick-item{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--border);border-radius:8px;background:var(--panel);margin-bottom:5px;cursor:pointer}
.pick-item:hover{border-color:var(--accent-border);background:#f6f9ff}
.pick-item.on{border-color:var(--accent-border);background:var(--accent-bg)}
.pick-item input{margin:0;accent-color:var(--accent)}
.pick-item .nm{font-size:12px;font-weight:600;color:var(--text-h);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-item .meta{font-size:9px;color:#98a2b3;display:flex;gap:5px;flex-wrap:wrap}
.rel-summary{margin-top:14px;border:1px solid var(--border);border-radius:10px;background:var(--panel);box-shadow:var(--shadow-sm);overflow:hidden}
.rel-summary-head{padding:9px 11px;border-bottom:1px solid #eef0f3;background:#f7f8fa;font-size:12px;font-weight:700}
.rel-table{width:100%;border-collapse:collapse;font-size:11px}
.rel-table th,.rel-table td{padding:8px 10px;text-align:left;border-bottom:1px solid #eef0f3;vertical-align:top}
.rel-table th{background:#f7f8fa;color:#475467;font-size:10px;font-weight:700}
.rel-table td{color:var(--text-h)}
.rel-chips{display:flex;flex-wrap:wrap;gap:4px}
.rel-chip{font-size:10px;padding:2px 6px;border-radius:5px;background:#f7f8fa;border:1px solid var(--border);color:var(--text-h)}

/* scene list (planning) */
.list-wrap{padding:18px 20px 40px;max-width:1400px;margin:0 auto}
.list-hero{margin-bottom:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.list-hero h1{font-size:20px;font-weight:800}
.list-hero p{font-size:12px;color:#667085;margin-top:3px}
.list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sc-card{border:1px solid var(--border);border-radius:var(--r-md);background:var(--panel);box-shadow:var(--shadow-sm);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:9px;transition:border-color .15s,box-shadow .15s,transform .15s}
.sc-card:hover{border-color:var(--accent-border);box-shadow:var(--shadow);transform:translateY(-2px)}
.sc-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.pri{font-size:10px;font-weight:700;color:#6d3bd6;background:#f6f2ff;padding:3px 7px;border-radius:5px;border:1px solid #e4d8fb}
.st{font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px}
.st-pre{background:#eef2ff;color:#4266d5}
.st-pub{background:#eaf8f1;color:#27815d}
.st-ing{background:#fff3df;color:#b06a18}
.sc-card h3{font-size:15px;font-weight:700}
.sc-rdy{display:flex;align-items:center;gap:7px}
.sc-rdy b{font-size:12px;color:var(--text-h)}
.sc-rdy span{font-size:10px;color:#98a2b3}
.sc-bar{flex:1;height:5px;border-radius:99px;background:#ece9f6;overflow:hidden}
.sc-bar .fill{height:100%;background:linear-gradient(90deg,#7552ff,#2f7df6)}
.sc-foot{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#98a2b3;border-top:1px solid #eef0f3;padding-top:7px;margin-top:auto}
.sc-foot .enter{color:var(--accent);font-weight:600}

/* studio (assemble) */
.studio{display:flex;flex-direction:column;height:100%;min-height:0}
.st-head{padding:14px 20px 10px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#fff,#f6f9ff);flex-shrink:0}
.st-head-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.st-head h2{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.ext-name{font-size:15px;font-weight:800;color:var(--text-h);border:1px solid #e0e6f0;border-radius:7px;padding:5px 10px;outline:none;min-width:200px;background:#fff}
.ext-name:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.st-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:7px}
.st-pill.pre{background:#eef2ff;color:#4266d5;border:1px solid #d6dcff}
.st-pill.pub{background:#eaf8f1;color:#27815d;border:1px solid #b9e6cd}
.st-pill.ing{background:#fff3df;color:#b06a18;border:1px solid #ffe0a3}
.st-head-sub{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.ext-desc{flex:1;min-width:220px;font-size:12px;color:#475467;border:1px solid #eef0f3;border-radius:7px;padding:6px 9px;background:#fff;outline:none;min-height:32px}
.ext-desc:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.st-acts{display:flex;gap:4px;flex-wrap:wrap}
.st-acts .tag{font-size:10px;padding:2px 7px;border-radius:99px;background:#fff7e6;color:#92611a;border:1px solid #ffe0a3}
/* readiness gauge */
.gauge{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:linear-gradient(145deg,#fff,#f6f9ff);margin:14px 20px 0}
.gauge .ring{position:relative;width:56px;height:56px;flex-shrink:0}
.gauge .ring svg{transform:rotate(-90deg)}
.gauge .ring .bg{fill:none;stroke:#ece9f6;stroke-width:6}
.gauge .ring .fg{fill:none;stroke:url(#g);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .4s}
.gauge .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--text-h)}
.gauge .info{flex:1}
.gauge .info b{font-size:14px;color:var(--text-h)}
.gauge .info span{display:block;font-size:11px;color:#98a2b3;margin-top:2px}
.gauge .acts{font-size:10px;color:#98a2b3}
.st-body{flex:1;overflow-y:auto;padding:14px 20px 20px}
.grp{border:1px solid var(--border);border-radius:var(--r-md);background:var(--panel);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:12px}
.grp-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #eef0f3;background:#f7f8fa}
.grp-head .ftag{width:22px;height:22px;border-radius:6px;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.grp-head b{font-size:13px}
.grp-head .cnt{margin-left:auto;font-size:10px;color:#98a2b3;background:var(--panel);padding:1px 7px;border-radius:99px;border:1px solid var(--border)}
.grp-body{padding:6px}
.cap-row{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:8px;font-size:12px;color:var(--text-h);margin-bottom:3px;border:1px solid transparent}
.cap-row:hover{background:#f6f9ff;border-color:var(--border)}
.cap-row .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap-row .ds{font-size:10px;color:#98a2b3;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap-row .reuse{font-size:9px;font-weight:600;color:#6d3bd6;background:#f6f2ff;padding:1px 5px;border-radius:4px;border:1px solid #e4d8fb}
.cap-row .actags{display:flex;gap:3px;flex-wrap:wrap}
.cap-row .actags .a{font-size:9px;color:#92611a;background:#fff7e6;border:1px solid #ffe0a3;padding:0 5px;border-radius:4px}
.ver-sel{height:24px;max-width:78px;padding:0 3px;border:1px solid var(--border);border-radius:5px;background:var(--panel);color:var(--text-h);font-size:10px;font-family:var(--mono)}
/* publish + history */
.panel-card{border:1px solid var(--border);border-radius:var(--r-md);background:var(--panel);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:12px}
.panel-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:#f7f8fa;border-bottom:1px solid #eef0f3}
.panel-card-head h3{font-size:12px;font-weight:700}
.panel-card-head .sub{font-size:10px;color:#98a2b3}
.panel-card-body{padding:12px}
.pub-stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pub-stages li{display:flex;align-items:center;gap:7px;font-size:11px;color:#98a2b3}
.pub-stages li.active{color:var(--accent);font-weight:600}
.pub-stages li.done{color:var(--ok)}
.pub-stages .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--border);flex-shrink:0}
.pub-stages li.active .dot{border-color:var(--accent);background:var(--accent);animation:pulse 1.1s infinite}
.pub-stages li.done .dot{border-color:var(--ok);background:var(--ok)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pub-bar{height:5px;background:#ece9f6;border-radius:99px;overflow:hidden;margin-top:8px}
.pub-bar .fill{height:100%;background:linear-gradient(90deg,#7552ff,#2f7df6);transition:width .4s}
.hist-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eef0f3}
.hist-row:last-child{border-bottom:0}
.hist-ver{font:600 12px var(--mono);color:var(--text-h);min-width:46px}
.hist-name{font-size:12px;color:var(--text-h);font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-items{display:flex;gap:4px;flex-wrap:wrap}
.hist-items .hchip{font-size:9px;padding:1px 5px;border-radius:4px;background:#f7f8fa;border:1px solid var(--border);color:var(--text-h)}
.hist-at{font-size:10px;color:#98a2b3;font-family:var(--mono)}
.hist-st{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;background:#eaf8f1;color:#27815d}

/* modal */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.48);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px}
.modal{width:min(620px,100%);max-height:88vh;display:flex;flex-direction:column;background:var(--panel);border-radius:14px;box-shadow:var(--shadow-pop);overflow:hidden}
.modal.lg{width:min(860px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:14px}
.modal-body{flex:1;overflow-y:auto;padding:16px 18px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border);background:#fafbfd}
.x-btn{border:0;background:transparent;font-size:20px;line-height:1;color:#98a2b3;width:28px;height:28px;border-radius:6px}
.x-btn:hover{background:#f1f3f7;color:var(--text-h)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.field>span{font-size:11px;font-weight:700;color:#475467}
.field input,.field select,.field textarea{width:100%;height:32px;padding:0 9px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text-h);font-size:12px;outline:none}
.field textarea{height:auto;min-height:56px;padding:7px 9px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.field-hint{font-size:10px;color:#98a2b3;margin-top:3px;line-height:1.5}
.radio-row{display:flex;gap:8px}
.radio{flex:1;display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--border);border-radius:7px;cursor:pointer;font-size:11px;color:var(--text-h)}
.radio.active{border-color:var(--accent-border);background:var(--accent-bg);color:var(--accent)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;font-size:12px;padding:7px 15px;border-radius:99px;box-shadow:var(--shadow-pop);z-index:300;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">HW</div>
    <div class="brand-stack"><span class="brand-k">HARNESS</span><span class="brand-t">能力编排</span></div>
    <div class="mode-tabs" id="mode-tabs">
      <button class="mode-tab active" data-mode="planning">规划 · Extension 组装</button>
      <button class="mode-tab" data-mode="config">配置</button>
    </div>
    <select class="sel hidden" id="product-sel"></select>
    <div class="spacer"></div>
    <button class="btn btn-ghost btn-sm" id="btn-lib">能力库</button>
  </header>
  <div class="body" id="body"></div>
</div>
<svg width="0" height="0"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7552ff"/><stop offset="1" stop-color="#2f7df6"/></linearGradient></defs></svg>
<div id="modal-root"></div>
<div id="toast" class="toast"></div>

<script>
/* ============================== 数据 ============================== */
const PRODUCTS=[
  {id:'p-api',name:'API 网关产品线',dept:['研发体系','云平台产品部','基础服务开发部']},
  {id:'p-mobile',name:'智能终端产品线',dept:['研发体系','智能终端产品部','终端开发一部']},
  {id:'p-quality',name:'质量产品线',dept:['质量与运维体系','测试中心']},
  {id:'p-sre',name:'SRE 产品线',dept:['质量与运维体系','SRE与监控部']},
];
// 活动字典（活动管理维护；关系配置引用）
let ACTIVITY_DICT=[
  {p:'研发提效',c:['需求拆解','代码评审','代码补全']},
  {p:'质量保障',c:['静态扫描','缺陷归因']},
  {p:'知识沉淀',c:['经验沉淀','案例库']},
];
const ACTIVITIES_ALL=()=>ACTIVITY_DICT.flatMap(g=>[g.p,...g.c]);

// 能力库定义（母版；不带场景/活动，保持干净）
let LIBRARY=[
  {id:'cap-skill-1',type:'skill',name:'接口 Mock 生成',desc:'根据接口定义自动生成 Mock 数据与联调示例。',versions:['1.2.0','1.1.0','1.0.0'],owner:'李扶摇',level:'产品级',productId:'p-api',status:'已上线'},
  {id:'cap-skill-2',type:'skill',name:'接口文档生成',desc:'解析代码与注释生成接口 Markdown 文档。',versions:['1.0.0'],owner:'李扶摇',level:'产品级',productId:'p-api',status:'开发中'},
  {id:'cap-skill-3',type:'skill',name:'终端崩溃归因',desc:'聚合崩溃堆栈与版本信息定位根因。',versions:['1.3.0','1.2.0'],owner:'王致远',level:'部门级',productId:'p-mobile',status:'已上线'},
  {id:'cap-skill-4',type:'skill',name:'测试用例生成',desc:'围绕需求生成测试用例评审建议。',versions:['1.1.0'],owner:'赵思齐',level:'部门级',productId:'p-quality',status:'已上线'},
  {id:'cap-command-1',type:'command',name:'拉取代码仓库',desc:'从 Git 拉取指定分支代码到工作区。',versions:['1.2.0','1.1.0'],owner:'李扶摇',level:'产品级',productId:'p-api',status:'已上线'},
  {id:'cap-command-2',type:'command',name:'执行单测',desc:'在工作目录执行单元测试并输出报告。',versions:['1.0.0'],owner:'李扶摇',level:'产品级',productId:'p-api',status:'已上线'},
  {id:'cap-command-3',type:'command',name:'打包构建',desc:'执行构建流水线产出构建产物。',versions:['2.0.0','1.5.0'],owner:'王致远',level:'部门级',productId:'p-mobile',status:'已上线'},
  {id:'cap-command-4',type:'command',name:'发布到市场',desc:'将构建产物发布到 Skill 市场。',versions:['0.9.0'],owner:'李扶摇',level:'产品级',productId:'p-api',status:'开发中'},
  {id:'cap-agent-1',type:'agent',name:'代码评审 Agent',desc:'基于变更集执行代码评审并输出评审意见。',versions:['1.0.0'],owner:'陈嘉树',level:'部门级',productId:'p-api',status:'已上线'},
  {id:'cap-agent-2',type:'agent',name:'缺陷归因 Agent',desc:'对测试缺陷进行归因分析并给出处置建议。',versions:['1.0.0'],owner:'赵思齐',level:'部门级',productId:'p-quality',status:'已上线'},
  {id:'cap-agent-3',type:'agent',name:'日志异常定位 Agent',desc:'汇总日志与调用链输出问题定位摘要。',versions:['1.1.0'],owner:'陈嘉树',level:'部门级',productId:'p-sre',status:'已上线'},
];
const TYPE={skill:{s:'S',n:'Skill',c:'var(--skill)'},command:{s:'C',n:'Command',c:'var(--command)'},agent:{s:'A',n:'Agent',c:'var(--agent)'}};
const SB={规划中:'sb-plan',开发中:'sb-dev',已上线:'sb-live'};

// 二级场景
let SCENES=[
  {id:'scn-api',primary:'研发交付',name:'接口开发',productId:'p-api',dept:['研发体系','云平台产品部','基础服务开发部'],level:'部门级',owner:{no:'A0123',name:'李扶摇'},goal:'从拉代码到发布接口能力的端到端流。',
   extension:{name:'接口开发 Extension',desc:'覆盖编码、Mock、文档、评审与发布。'},publishedVersions:[{version:'0.1',name:'接口开发 Extension',desc:'初版：拉代码+Mock+评审。',items:[{type:'command',name:'拉取代码仓库',version:'1.1.0'},{type:'agent',name:'代码评审 Agent',version:'1.0.0'}],at:'2026-07-22 10:14',status:'已发布'}],publishing:null},
  {id:'scn-build',primary:'研发交付',name:'构建发布',productId:'p-api',dept:['研发体系','云平台产品部','基础服务开发部'],level:'部门级',owner:{no:'A0123',name:'李扶摇'},goal:'构建到市场发布的流水线。',extension:{name:'构建发布 Extension',desc:''},publishedVersions:[],publishing:null},
  {id:'scn-mobile',primary:'研发交付',name:'终端开发',productId:'p-mobile',dept:['研发体系','智能终端产品部','终端开发一部'],level:'部门级',owner:{no:'A0123',name:'李扶摇'},goal:'终端应用构建、崩溃归因与发布。',extension:{name:'终端开发 Extension',desc:'构建、崩溃归因、发布。'},publishedVersions:[],publishing:null},
  {id:'scn-test',primary:'质量保障',name:'测试执行',productId:'p-quality',dept:['质量与运维体系','测试中心'],level:'部门级',owner:{no:'A0123',name:'李扶摇'},goal:'用例生成与单测执行。',extension:{name:'测试执行 Extension',desc:''},publishedVersions:[],publishing:null},
  {id:'scn-bug',primary:'质量保障',name:'缺陷处理',productId:'p-quality',dept:['质量与运维体系','测试中心'],level:'部门级',owner:{no:'A0123',name:'李扶摇'},goal:'缺陷归因与处置。',extension:{name:'缺陷处理 Extension',desc:''},publishedVersions:[],publishing:null},
  {id:'scn-log',primary:'运维监控',name:'日志分析',productId:'p-sre',dept:['质量与运维体系','SRE与监控部'],level:'部门级',owner:{no:'A0123',name:'李扶摇'},goal:'日志异常定位。',extension:{name:'日志分析 Extension',desc:''},publishedVersions:[],publishing:null},
];

// 关系配置：(场景, 活动, [能力…]) 多对多，类型混选
let RELATIONS=[
  {id:'rel1',sceneId:'scn-api',activity:'代码评审',capIds:['cap-agent-1']},
  {id:'rel2',sceneId:'scn-api',activity:'代码补全',capIds:['cap-skill-1']},
  {id:'rel3',sceneId:'scn-api',activity:'需求拆解',capIds:['cap-command-1','cap-skill-2']},
  {id:'rel4',sceneId:'scn-api',activity:'',capIds:['cap-command-4']},
  {id:'rel5',sceneId:'scn-mobile',activity:'研发提效',capIds:['cap-command-3','cap-skill-3']},
];

/* ============================== 工具 ============================== */
const $=(s,r=document)=>r.querySelector(s);const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const svg=d=>`<svg viewBox="0 0 24 24">${d}</svg>`;
const icoPlus=svg('<path d="M12 5v14M5 12h14"/>');
const icoTrash=svg('<path d="M4 7h16M9 7V5h6v2m-8 3 1 9h8l1-9"/>');
const icoSearch=svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>');
let toastT;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2200);}
const uid=()=>('x'+Math.random().toString(36).slice(2,8));
const productOf=id=>PRODUCTS.find(p=>p.id===id);
const masterOf=id=>LIBRARY.find(m=>m.id===id);
const sceneOf=id=>SCENES.find(s=>s.id===id);
// 某场景的所有关系组
function sceneRelations(sid){return RELATIONS.filter(r=>r.sceneId===sid);}
// 某场景的全部能力（去重）+ 各能力挂的活动
function sceneCaps(sid){
  const map=new Map();
  sceneRelations(sid).forEach(r=>{r.capIds.forEach(cid=>{if(!map.has(cid))map.set(cid,[]);if(r.activity)map.get(cid).push(r.activity);});});
  return [...map.entries()].map(([cid,acts])=>({cap:masterOf(cid),activities:acts})).filter(x=>x.cap);
}
function readyCount(sid){const cs=sceneCaps(sid);const t=cs.length;const r=cs.filter(x=>x.cap.status==='已上线').length;return {total:t,ready:r};}
function allReady(sid){const r=readyCount(sid);return r.total>0&&r.ready===r.total;}
function sceneState(s){if(s.publishing)return 'ing';if(s.publishedVersions.length)return 'pub';return 'pre';}
const ST_LABEL={pre:'预发布',ing:'发布中',pub:'已发布'};
// 能力被多少场景关系引用
function capRefCount(cid){return RELATIONS.filter(r=>r.capIds.includes(cid)).length;}

/* ============================== 状态 ============================== */
let state={mode:'planning',productId:'p-api',activeSceneId:null,cfgSection:'caplib',relCfg:{sceneId:'scn-api',activity:'',kw:'',t:''},capLib:{kw:'',t:'',lv:''}};

/* ============================== 渲染 ============================== */
function render(){
  $('#product-sel').innerHTML=PRODUCTS.map(p=>`<option value="${p.id}" ${state.productId===p.id?'selected':''}>${esc(p.name)}</option>`).join('');
  $('#product-sel').classList.toggle('hidden',state.mode!=='planning');
  if(state.mode==='config'){renderConfig();return;}
  if(!state.activeSceneId)renderSceneList();else renderStudio();
}
$('#product-sel').onchange=e=>{state.productId=e.target.value;state.activeSceneId=null;render();};
$('#mode-tabs').onclick=e=>{const t=e.target.closest('[data-mode]');if(!t)return;state.mode=t.dataset.mode;if(state.mode==='config')state.activeSceneId=null;render();};
$('#btn-lib').onclick=()=>{state.mode='config';state.cfgSection='caplib';render();};

/* ---------- 配置视角 ---------- */
function renderConfig(){
  const tabs=[{k:'caplib',l:'能力库定义'},{k:'rel',l:'关系配置'},{k:'scene',l:'场景管理'},{k:'act',l:'活动管理'},{k:'perm',l:'部门权限'}];
  $('#body').innerHTML=`<div class="cfg-tabs">${tabs.map(t=>`<button class="cfg-tab ${state.cfgSection===t.k?'active':''}" data-cfg="${t.k}">${t.l}</button>`).join('')}</div>
    <div class="cfg-wrap" id="cfg-wrap"></div>`;
  $$('.cfg-tab').forEach(b=>b.onclick=()=>{state.cfgSection=b.dataset.cfg;renderConfig();});
  if(state.cfgSection==='caplib')renderCapLib();
  else if(state.cfgSection==='rel')renderRel();
  else renderCfgPlaceholder(state.cfgSection);
}
function renderCfgPlaceholder(k){
  const map={scene:{ico:'▦',t:'场景管理',d:'一/二级场景分类体系，按 scope 维护。',tag:'原样保留'},act:{ico:'◴',t:'活动管理',d:'活动标签字典维护；仅作标签，不参与复用判定。',tag:'原样保留'},perm:{ico:'⬡',t:'部门权限配置',d:'规划与配置人员授权。',tag:'原样保留'}};
  const m=map[k];
  let body='';
  if(k==='act'){
    body=`<div class="tools"><div class="spacer"></div><button class="btn btn-soft btn-sm" id="act-add">${icoPlus}新增一级活动</button></div>
      ${ACTIVITY_DICT.map((g,i)=>`<div class="cap-card"><div class="info"><div class="nm">${esc(g.p)} <span class="ref">一级</span></div><div class="meta"><span class="vers">${g.c.map(c=>`<span class="vchip">${esc(c)}<button class="x" style="border:0;background:transparent;color:#92611a" data-del-c="${i}|${esc(c)}">×</button></span>`).join('')}<button class="addver" data-add-c="${i}">+</button></span></div></div>
        <div class="cap-actions"><button class="btn btn-danger btn-sm" data-del-p="${i}">删除</button></div></div>`).join('')}`;
  }
  $('#cfg-wrap').innerHTML=`<div class="cfg-hero"><h1>${m.t}</h1><p>${m.d}</p></div>
    <div class="cfg-placeholder"><div class="pc-card"><div class="pc-ico">${m.ico}</div><h3>${m.t}</h3><p>${m.d}</p><span class="pc-tag">${m.tag}</span></div></div>
    ${k==='act'?`<div style="margin-top:14px"><div class="intro">活动仅作标签；在<b>关系配置</b>里把活动与能力、场景关联。运营不在本模块做。</div>${body}</div>`:''}`;
  if(k==='act'){
    const input=prompt?null:null;
    $('#act-add').onclick=()=>{const v=prompt('一级活动名称');if(v&&v.trim()&&!ACTIVITY_DICT.some(g=>g.p===v.trim())){ACTIVITY_DICT.push({p:v.trim(),c:[]});renderCfgPlaceholder('act');}};
    $$('#cfg-wrap [data-del-p]').forEach(b=>b.onclick=()=>{ACTIVITY_DICT.splice(+b.dataset.delP,1);renderCfgPlaceholder('act');});
    $$('#cfg-wrap [data-add-c]').forEach(b=>b.onclick=()=>{const i=+b.dataset.addC;const v=prompt('二级活动名称');if(v&&v.trim())ACTIVITY_DICT[i].c.push(v.trim());renderCfgPlaceholder('act');});
    $$('#cfg-wrap [data-del-c]').forEach(b=>b.onclick=()=>{const[i,c]=b.dataset.delC.split('|');ACTIVITY_DICT[i].c=ACTIVITY_DICT[i].c.filter(x=>x!==c);renderCfgPlaceholder('act');});
  }
}

/* 能力库定义 */
function renderCapLib(){
  const f=state.capLib;
  let list=LIBRARY.slice();
  if(f.t)list=list.filter(m=>m.type===f.t);
  if(f.lv)list=list.filter(m=>m.level===f.lv);
  if(f.kw){const q=f.kw.toLowerCase();list=list.filter(m=>(m.name+m.desc).toLowerCase().includes(q));}
  $('#cfg-wrap').innerHTML=`<div class="cfg-hero"><h1>能力库定义</h1><p>skill/command/agent 母版。开发一次、跨场景复用；不带场景/活动（保持干净），关联在"关系配置"。</p></div>
    <div class="intro">能力来自此处<b>新增/导入</b>。改 level/状态/版本会<b>即时同步</b>到所有引用它的场景（组装页就绪度随之变化）。</div>
    <div class="tools">
      <div class="search">${icoSearch}<input id="cl-kw" value="${esc(f.kw)}" placeholder="搜索名称/说明"/></div>
      <div class="type-chips" id="cl-types"><button class="type-chip ${f.t===''?'active':''}" data-t="">全部</button><button class="type-chip ${f.t==='skill'?'active':''}" data-t="skill">Skill</button><button class="type-chip ${f.t==='command'?'active':''}" data-t="command">Command</button><button class="type-chip ${f.t==='agent'?'active':''}" data-t="agent">Agent</button></div>
      <div class="type-chips" id="cl-levels"><button class="type-chip ${f.lv===''?'active':''}" data-lv="">全部层级</button><button class="type-chip ${f.lv==='产品级'?'active':''}" data-lv="产品级">产品级</button><button class="type-chip ${f.lv==='部门级'?'active':''}" data-lv="部门级">部门级</button></div>
      <div class="tool-spacer"></div>
      <button class="btn btn-soft btn-sm" id="cl-import">导入</button>
      <button class="btn btn-soft btn-sm" id="cl-export">导出</button>
      <button class="btn btn-primary btn-sm" id="cl-add">${icoPlus}新增能力</button>
    </div>
    <div id="cl-list"></div>`;
  paint();
  function paint(){
    $('#cl-list').innerHTML=list.length?list.map(m=>{const prod=productOf(m.productId);const refs=capRefCount(m.id);return `<div class="cap-card" data-id="${m.id}">
      <span class="type-tag ${m.type}">${TYPE[m.type].s}</span>
      <div class="info">
        <div class="nm">${esc(m.name)} ${refs?`<span class="ref">${refs} 场景关系</span>`:''}</div>
        <div class="ds">${esc(m.desc)||'<span style="color:#cbd2dc">无说明</span>'}</div>
        <div class="meta">
          <span>${esc(prod.name)}</span>
          <label class="ctr">level <select data-lv>${['产品级','部门级'].map(x=>`<option ${m.level===x?'selected':''}>${x}</option>`).join('')}</select></label>
          <label class="ctr">状态 <select data-st>${['规划中','开发中','已上线'].map(x=>`<option ${m.status===x?'selected':''}>${x}</option>`).join('')}</select></label>
          <span class="vers">版本 ${m.versions.map(v=>`<span class="vchip">${esc(v)}</span>`).join('')}<button class="addver" data-addver>+</button></span>
        </div>
      </div>
      <div class="cap-actions"><button class="btn btn-ghost btn-sm" data-edit>编辑</button><button class="btn btn-danger btn-sm" data-del>删除</button></div>
    </div>`;}).join(''):'<div class="empty">无匹配能力</div>';
  }
  $('#cl-kw').oninput=e=>{f.kw=e.target.value;renderCapLib();};
  $('#cl-types').onclick=e=>{const c=e.target.closest('[data-t]');if(!c)return;f.t=c.dataset.t;renderCapLib();};
  $('#cl-levels').onclick=e=>{const c=e.target.closest('[data-lv]');if(!c)return;f.lv=c.dataset.lv;renderCapLib();};
  $('#cl-add').onclick=()=>openCapForm(null,()=>renderCapLib());
  $('#cl-import').onclick=()=>toast('导入：上传 Excel 校验后批量写入');
  $('#cl-export').onclick=()=>toast('已开始导出能力库');
  $('#cl-list').onchange=e=>{const card=e.target.closest('[data-id]');if(!card)return;const m=masterOf(card.dataset.id);if(!m)return;if(e.target.matches('[data-lv]'))m.level=e.target.value;else if(e.target.matches('[data-st]')){m.status=e.target.value;toast(`${m.name} → ${m.status}（已同步到引用场景）`);}};
  $('#cl-list').onclick=e=>{const card=e.target.closest('[data-id]');if(!card)return;const m=masterOf(card.dataset.id);if(!m)return;
    if(e.target.closest('[data-addver]')){const v=prompt('新版本号','1.0.0');if(v&&v.trim()&&!m.versions.includes(v.trim())){m.versions.unshift(v.trim());renderCapLib();}}
    else if(e.target.closest('[data-edit]'))openCapForm(m,()=>renderCapLib());
    else if(e.target.closest('[data-del]')){if(capRefCount(m.id)){toast(`被 ${capRefCount(m.id)} 个场景关系引用，先在关系配置解除`);return;}LIBRARY=LIBRARY.filter(x=>x.id!==m.id);renderCapLib();toast('已删除');}
  };
}
function openCapForm(m,onSaved){
  const isNew=!m;const selLv=m?m.level:'产品级';
  openModal(`<div class="modal"><div class="modal-head"><h3>${isNew?'新增能力':'编辑能力'}</h3><button class="x-btn" data-close>×</button></div>
    <div class="modal-body">
      <div class="field"><span>类型</span><select id="cf-t">${['skill','command','agent'].map(x=>`<option value="${x}" ${m&&m.type===x?'selected':''}>${TYPE[x].n}</option>`).join('')}</select></div>
      <div class="field"><span>名称 *</span><input id="cf-n" value="${m?esc(m.name):''}" placeholder="能力名称"/></div>
      <div class="field"><span>说明</span><textarea id="cf-d" placeholder="能力职责">${m?esc(m.desc):''}</textarea></div>
      <div class="field"><span>责任人</span><input id="cf-o" value="${m?esc(m.owner||''):'李扶摇'}"/></div>
      <div class="field"><span>所属产品</span><select id="cf-p">${PRODUCTS.map(p=>`<option value="${p.id}" ${m?m.productId===p.id?'selected':'':(p.id===state.productId?'selected':'')}>${esc(p.name)}</option>`).join('')}</select></div>
      <div class="field"><span>level · 默认可见/维护归属（不卡引用）</span>
        <div class="radio-row">${['产品级','部门级'].map(x=>`<label class="radio ${selLv===x?'active':''}" data-lv="${x}"><input type="radio" name="lv" ${selLv===x?'checked':''}/>${x}</label>`).join('')}</div>
        <div class="field-hint">想通用就选部门级；产品级也不影响别人主动全局查找引用。</div>
      </div>
      <div class="field"><span>状态</span><select id="cf-st">${['规划中','开发中','已上线'].map(x=>`<option ${m?(m.status===x?'selected':''):(x==='规划中'?'selected':'')}>${x}</option>`).join('')}</select></div>
      ${isNew?'<div class="field"><span>初始版本</span><input id="cf-v" value="0.1.0"/></div>':''}
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close>取消</button><button class="btn btn-primary" id="cf-ok">${isNew?'创建':'保存'}</button></div></div>`);
  let lv=selLv;
  $$('#modal-root .radio').forEach(r=>r.onclick=()=>{lv=r.dataset.lv;$$('#modal-root .radio').forEach(x=>x.classList.remove('active'));r.classList.add('active');r.querySelector('input').checked=true;});
  $('#cf-ok').onclick=()=>{
    const n=$('#cf-n').value.trim();if(!n){toast('请输入名称');return;}
    const pid=$('#cf-p').value;
    if(isNew){LIBRARY.push({id:uid(),type:$('#cf-t').value,name:n,desc:$('#cf-d').value.trim(),versions:[$('#cf-v').value.trim()||'0.1.0'],owner:$('#cf-o').value.trim(),level:lv,productId:pid,status:$('#cf-st').value});}
    else{Object.assign(m,{type:$('#cf-t').value,name:n,desc:$('#cf-d').value.trim(),owner:$('#cf-o').value.trim(),level:lv,productId:pid,status:$('#cf-st').value});}
    closeModal();onSaved&&onSaved();toast(isNew?'已创建':'已保存（已同步到引用场景）');
  };
}

/* 关系配置 */
function renderRel(){
  const f=state.relCfg;
  const scene=sceneOf(f.sceneId);
  const group=RELATIONS.find(r=>r.sceneId===f.sceneId&&r.activity===f.activity);
  const attached=group?group.capIds.slice():[];
  let list=LIBRARY.slice();
  if(f.t)list=list.filter(m=>m.type===f.t);
  if(f.kw){const q=f.kw.toLowerCase();list=list.filter(m=>(m.name+m.desc).toLowerCase().includes(q));}
  $('#cfg-wrap').innerHTML=`<div class="cfg-hero"><h1>关系配置</h1><p>能力 ↔ 场景 ↔ 活动的多对多关系。统一不分类型：选场景+活动，多选挂载任意 skill/command/agent。</p></div>
    <div class="intro">这里配好关系后，<b>Extension 组装</b>页会自动带出该场景的全部能力并显示开发进度。配关系时能力可以是<b>开发中</b>——先挂上，等它开发完即可发布。</div>
    <div class="rel-pickers">
      <span class="lbl">场景</span><select class="sel" id="rc-scene">${SCENES.map(s=>`<option value="${s.id}" ${f.sceneId===s.id?'selected':''}>${esc(productOf(s.productId).name)} · ${esc(s.name)}</option>`).join('')}</select>
      <span class="lbl">活动</span><select class="sel" id="rc-act"><option value="">（不绑活动）</option>${ACTIVITIES_ALL().map(a=>`<option ${f.activity===a?'selected':''}>${esc(a)}</option>`).join('')}</select>
      <span style="font-size:11px;color:#98a2b3">已挂 <b id="rc-cnt" style="color:var(--text-h)">${attached.length}</b> 个能力</span>
    </div>
    <div class="rel-cols">
      <div class="rel-col">
        <div class="rel-col-head"><div><h3>可挂载能力</h3><span class="sub">勾选即挂载到当前 场景+活动；类型混选</span></div>
          <div class="type-chips" id="rc-types"><button class="type-chip ${f.t===''?'active':''}" data-t="">全部</button><button class="type-chip ${f.t==='skill'?'active':''}" data-t="skill">Skill</button><button class="type-chip ${f.t==='command'?'active':''}" data-t="command">Command</button><button class="type-chip ${f.t==='agent'?'active':''}" data-t="agent">Agent</button></div>
        </div>
        <div style="padding:8px 8px 4px"><div class="search">${icoSearch}<input id="rc-kw" value="${esc(f.kw)}" placeholder="搜索能力"/></div></div>
        <div class="rel-col-body" id="rc-list"></div>
      </div>
      <div class="rel-col">
        <div class="rel-col-head"><div><h3>已挂载</h3><span class="sub">当前 场景+活动</span></div></div>
        <div class="rel-col-body" id="rc-attached"></div>
      </div>
    </div>
    <div class="rel-summary">
      <div class="rel-summary-head">${esc(scene?scene.name:'')} · 全部关系</div>
      <table class="rel-table"><thead><tr><th>活动</th><th>挂载能力</th></tr></thead><tbody id="rc-sum"></tbody></table>
    </div>`;
  paintRel();
  function paintRel(){
    $('#rc-list').innerHTML=list.length?list.map(m=>{const on=attached.includes(m.id);const prod=productOf(m.productId);return `<label class="pick-item ${on?'on':''}" data-cap="${m.id}"><input type="checkbox" ${on?'checked':''}/><span class="type-tag ${m.type}">${TYPE[m.type].s}</span><span class="nm">${esc(m.name)}</span><span class="meta"><span>${TYPE[m.type].n}</span><span>${esc(prod.name)}</span><span class="status-badge ${SB[m.status]}"><span class="d"></span>${m.status}</span></span></label>`;}).join(''):'<div class="empty">无匹配能力</div>';
    $('#rc-attached').innerHTML=attached.length?attached.map(cid=>{const m=masterOf(cid);if(!m)return'';const prod=productOf(m.productId);const reuse=prod.id!==scene.productId;return `<div class="pick-item on"><span class="type-tag ${m.type}">${TYPE[m.type].s}</span><div style="flex:1;min-width:0"><div class="nm">${esc(m.name)}</div><div class="meta">${reuse?'<span class="reuse" style="color:#6d3bd6">跨产品·'+esc(prod.name)+'</span>':'<span>'+esc(prod.name)+'</span>'}<span class="status-badge ${SB[m.status]}"><span class="d"></span>${m.status}</span></div></div><button class="btn btn-danger btn-sm" data-rm="${cid}">移除</button></div>`;}).join(''):'<div class="empty">未挂载任何能力</div>';
    const groups=sceneRelations(f.sceneId);
    $('#rc-sum').innerHTML=groups.length?groups.map(g=>`<tr><td>${g.activity?'<span class="rel-chip">'+esc(g.activity)+'</span>':'<span style="color:#98a2b3">未绑活动</span>'}</td><td><div class="rel-chips">${g.capIds.map(cid=>{const m=masterOf(cid);return m?`<span class="rel-chip">${TYPE[m.type].s} ${esc(m.name)}</span>`:'';}).join('')}</div></td></tr>`).join(''):'<tr><td colspan="2" style="color:#98a2b3;text-align:center;padding:14px">该场景暂无关系</td></tr>';
    $('#rc-cnt').textContent=attached.length;
  }
  $('#rc-scene').onchange=e=>{f.sceneId=e.target.value;renderRel();};
  $('#rc-act').onchange=e=>{f.activity=e.target.value;renderRel();};
  $('#rc-kw').oninput=e=>{f.kw=e.target.value;renderRel();};
  $('#rc-types').onclick=e=>{const c=e.target.closest('[data-t]');if(!c)return;f.t=c.dataset.t;renderRel();};
  $('#rc-list').onclick=e=>{const it=e.target.closest('[data-cap]');if(!it)return;toggleRel(f.sceneId,f.activity,it.dataset.cap);renderRel();};
  $('#rc-attached').onclick=e=>{const b=e.target.closest('[data-rm]');if(!b)return;toggleRel(f.sceneId,f.activity,b.dataset.rm,true);renderRel();};
}
function toggleRel(sid,activity,capId,forceRemove){
  let g=RELATIONS.find(r=>r.sceneId===sid&&r.activity===activity);
  if(!g){if(forceRemove)return;RELATIONS.push({id:uid(),sceneId:sid,activity,capIds:[capId]});return;}
  const i=g.capIds.indexOf(capId);
  if(i>=0){g.capIds.splice(i,1);if(!g.capIds.length)RELATIONS=RELATIONS.filter(r=>r!==g);}
  else g.capIds.push(capId);
}

/* ---------- 规划视角：场景列表 ---------- */
function renderSceneList(){
  const prod=productOf(state.productId);
  const list=SCENES.filter(s=>s.productId===state.productId);
  $('#body').innerHTML=`<div class="list-wrap">
    <div class="list-hero"><div><h1>${esc(prod.name)}</h1><p>二级场景即 Extension 交付单元。先在配置·关系配置挂好能力，这里看全景进度并发布。</p></div></div>
    <div class="list-grid">${list.length?list.map(scCard).join(''):'<div style="grid-column:1/-1;padding:40px;text-align:center;color:#98a2b3">该产品暂无场景</div>'}</div></div>`;
  $$('.sc-card').forEach(c=>c.onclick=()=>{state.activeSceneId=c.dataset.id;render();});
}
function scCard(s){
  const r=readyCount(s.id);const pct=r.total?Math.round(r.ready/r.total*100):0;const st=sceneState(s);
  const lastVer=s.publishedVersions[0]?.version;
  return `<div class="sc-card" data-id="${s.id}">
    <div class="sc-top"><span class="pri">${esc(s.primary)}</span><span class="st st-${st}">${ST_LABEL[st]}${st==='pub'?' v'+lastVer:''}</span></div>
    <h3>${esc(s.name)}</h3>
    <div class="sc-rdy"><b>${r.ready}/${r.total}</b><span>就绪 ${pct}%</span><div class="sc-bar"><div class="fill" style="width:${pct}%"></div></div></div>
    <div class="sc-foot"><span>${esc(s.owner.name)}</span><span class="enter">进入组装 →</span></div>
  </div>`;
}

/* ---------- 规划视角：Extension 组装 ---------- */
function renderStudio(){
  const s=sceneOf(state.activeSceneId);if(!s){state.activeSceneId=null;renderSceneList();return;}
  const prod=productOf(s.productId);
  const cs=sceneCaps(s.id);const r=readyCount(s.id);const canPub=allReady(s.id);const st=sceneState(s);
  const curVer=s.publishedVersions[0]?.version;
  const pct=r.total?Math.round(r.ready/r.total*100):0;
  const C=2*Math.PI*22;
  const byType={skill:[],command:[],agent:[]};cs.forEach(x=>byType[x.cap.type].push(x));
  const actsAll=[...new Set(cs.flatMap(x=>x.activities))];
  $('#body').innerHTML=`<div class="studio">
    <div class="st-head">
      <div class="st-head-top">
        <button class="btn btn-ghost btn-sm" id="st-back">← 场景列表</button>
        <span class="pri">${esc(s.primary)}</span>
        <h2>${esc(s.name)}</h2>
        <div class="spacer"></div>
        <input class="ext-name" id="ext-name" value="${esc(s.extension.name)}" placeholder="Extension 名称"/>
        <button class="btn ${canPub?'btn-success':'btn-primary'} btn-sm" id="st-pub" ${canPub&&st!=='ing'?'':'disabled'}>${st==='ing'?'发布中…':(canPub?'一键发布':'待就绪')}</button>
        <span class="st-pill ${st}">${ST_LABEL[st]}${st==='pub'?' · 最新 v'+curVer:''}${st==='pre'&&curVer?' · 已发 v'+curVer:''}</span>
      </div>
      <div class="st-head-sub">
        <input class="ext-desc" id="ext-desc" value="${esc(s.extension.desc)}" placeholder="Extension 描述（一句话）"/>
        <div class="st-acts">${actsAll.length?actsAll.map(a=>`<span class="tag">${esc(a)}</span>`).join(''):'<span style="font-size:10px;color:#cbd2dc">无活动标签</span>'}</div>
        <span class="chip">${s.level}</span><span class="chip">${esc(prod.dept.slice(-1)[0])}</span>
      </div>
    </div>
    <div class="gauge">
      <div class="ring"><svg width="56" height="56"><circle class="bg" cx="28" cy="28" r="22"/><circle class="fg" cx="28" cy="28" r="22" stroke-dasharray="${C}" stroke-dashoffset="${C-C*pct/100}"/></svg><div class="pct">${pct}%</div></div>
      <div class="info"><b>${r.ready}/${r.total} 能力就绪</b><span>${r.total-r.ready} 个待开发完成即可发布</span></div>
      <div class="acts">关系来源：${sceneRelations(s.id).length} 组 · 活动 ${actsAll.length}</div>
    </div>
    <div class="st-body" id="st-body">
      ${cs.length?['skill','command','agent'].filter(t=>byType[t].length).map(t=>`<div class="grp"><div class="grp-head"><span class="ftag ${t}">${TYPE[t].s}</span><b>${TYPE[t].n}</b><span class="cnt">${byType[t].length}</span></div><div class="grp-body">${byType[t].map(x=>capRow(s,x,prod)).join('')}</div></div>`).join(''):'<div class="empty">该场景尚未在关系配置挂载任何能力。去 配置·关系配置 挂载后回来组装。</div>'}
      ${s.publishing?renderProgress():''}
      <div class="panel-card"><div class="panel-card-head"><div><h3>发布历史</h3><span class="sub">同一张发布表的已发布行</span></div><span class="sub">${s.publishedVersions.length} 个版本</span></div><div class="panel-card-body">${renderHistory(s)}</div></div>
    </div>
  </div>`;
  $('#st-back').onclick=()=>{state.activeSceneId=null;render();};
  $('#ext-name').oninput=e=>{s.extension.name=e.target.value;};
  $('#ext-desc').oninput=e=>{s.extension.desc=e.target.value;};
  $('#st-pub').onclick=()=>startPublish(s);
  $('#st-body').onchange=e=>{const vs=e.target.closest('[data-ver]');if(!vs)return;const cid=vs.dataset.ver;const b=s.relationshipVersion||{};b[cid]=e.target.value;s.relationshipVersion=b;};
}
function capRow(s,x,prod){
  const m=x.cap;const reuse=m.productId!==s.productId;
  // 版本钉选：默认母版最新；若发布过则记在 s.relationshipVersion
  const pinned=s.relationshipVersion?.[m.id]||m.versions[0];
  return `<div class="cap-row">
    <span class="type-tag ${m.type}">${TYPE[m.type].s}</span>
    <div style="flex:1;min-width:0"><div class="nm">${esc(m.name)} ${reuse?`<span class="reuse">跨产品·${esc(productOf(m.productId).name)}</span>`:''}</div><div class="ds">${esc(m.desc)}</div></div>
    <div class="actags">${x.activities.map(a=>`<span class="a">${esc(a)}</span>`).join('')}</div>
    <select class="ver-sel" data-ver="${m.id}">${m.versions.map(v=>`<option ${v===pinned?'selected':''}>${v}</option>`).join('')}</select>
    <span class="status-badge ${SB[m.status]}"><span class="d"></span>${m.status}</span>
  </div>`;
}
function renderProgress(){
  return `<div class="panel-card"><div class="panel-card-head"><div><h3>发布进度</h3><span class="sub">预发布 → 发布中 → 已发布</span></div></div><div class="panel-card-body">
    <ul class="pub-stages" id="ps">${['打包就绪能力','提交同步申请','组织审批','发布到市场'].map((t,i)=>`<li class="${i===0?'active':''}"><span class="dot"></span>${t}</li>`).join('')}</ul>
    <div class="pub-bar"><div class="fill" id="pf" style="width:5%"></div></div></div></div>`;
}
function startPublish(s){
  if(!allReady(s.id)){toast('存在未就绪能力，暂不可发布');return;}
  if(s.publishing)return;
  s.publishing={stage:0};renderStudio();
  let i=0;
  const t=setInterval(()=>{
    const lis=$$('#ps li');const fill=$('#pf');if(!lis.length){clearInterval(t);return;}
    if(i<lis.length){lis[i].classList.remove('active');lis[i].classList.add('done');i++;if(i<lis.length)lis[i].classList.add('active');if(fill)fill.style.width=(i/lis.length*100)+'%';}
    else{
      clearInterval(t);
      const nextVer=s.publishedVersions.length?('0.'+(parseInt(s.publishedVersions[0].version.split('.')[1])+1)):'0.1';
      const cs=sceneCaps(s.id);
      s.publishedVersions.unshift({version:nextVer,name:s.extension.name,desc:s.extension.desc,items:cs.map(x=>({type:x.cap.type,name:x.cap.name,version:s.relationshipVersion?.[x.cap.id]||x.cap.versions[0]})),at:new Date().toISOString().slice(0,16).replace('T',' '),status:'已发布'});
      s.publishing=null;toast('发布成功 v'+nextVer);renderStudio();
    }
  },800);
}
function renderHistory(s){
  if(!s.publishedVersions.length)return '<div class="empty" style="margin:0">暂无发布历史</div>';
  return s.publishedVersions.map(v=>`<div class="hist-row"><span class="hist-ver">v${esc(v.version)}</span><span class="hist-name">${esc(v.name)}</span><span class="hist-items">${v.items.map(it=>`<span class="hchip">${TYPE[it.type].s} ${esc(it.name)} v${esc(it.version)}</span>`).join('')}</span><span class="hist-at">${esc(v.at)}</span><span class="hist-st">${esc(v.status)}</span></div>`).join('');
}

/* ---------- modal 基础（可层叠） ---------- */
function openModal(html){const root=$('#modal-root');const ov=document.createElement('div');ov.className='overlay';ov.innerHTML=html;root.appendChild(ov);ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-close]'))closeModal();});return ov;}
function closeModal(){const root=$('#modal-root');if(root.lastChild)root.removeChild(root.lastChild);}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

render();
</script>
</body>
</html>
