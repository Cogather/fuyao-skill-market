<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Extension 编排与调测 — 预览</title>
<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
<style>
:root {
  --text: #626b7c;
  --text-h: #15171d;
  --bg: #fbfcff;
  --panel: #ffffff;
  --border: #e9edf3;
  --code-bg: #f5f7fb;
  --accent: #2f7df6;
  --accent-2: #7552ff;
  --accent-bg: rgba(47, 125, 246, 0.1);
  --accent-border: rgba(47, 125, 246, 0.34);
  --shadow: 0 16px 48px rgba(22, 34, 51, 0.08);
  --mono: ui-monospace, Consolas, monospace;
  --sans: system-ui, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--sans);
  color: var(--text);
  background:
    linear-gradient(rgba(96,111,136,0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(96,111,136,0.045) 1px, transparent 1px),
    var(--bg);
  background-size: 34px 34px, 34px 34px, auto;
}
.app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* toolbar */
.ext-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--border); flex-shrink:0; }
.ext-toolbar-left { display:flex; align-items:center; gap:10px; min-width:0; }
.ext-pkg-icon { font-size:20px; }
.ext-pkg-title { font-size:15px; font-weight:600; color:var(--text); }
.ext-level-select { font-size:12px; font-weight:600; padding:4px 8px; border:1px solid var(--accent-border); border-radius:6px; background:var(--accent-bg); color:var(--accent); outline:none; cursor:pointer; }
.ext-level-select:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg); }
.ext-scope-text { font-size:12px; color:var(--text-h); max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ext-toolbar-right { display:flex; align-items:center; gap:8px; }
.ext-btn { padding:7px 14px; border-radius:7px; font-size:13px; cursor:pointer; border:1px solid transparent; transition:all .15s; display:inline-flex; align-items:center; gap:4px; font-family:inherit; }
.ext-btn:disabled { opacity:.5; cursor:not-allowed; }
.ext-btn-ghost { background:var(--panel); border-color:var(--border); color:var(--text-h); }
.ext-btn-ghost:hover:not(:disabled) { border-color:var(--accent-border); }
.ext-btn-primary { background:var(--accent); color:#fff; }
.ext-btn-primary:hover:not(:disabled) { background:#1f6fe0; }
.ext-publish-plus { font-size:16px; line-height:1; }

/* columns */
.ext-cols { flex:1; display:flex; min-height:0; }
.ext-col { display:flex; flex-direction:column; min-height:0; }
.ext-col-left { width:300px; border-right:1px solid var(--border); background:var(--bg); padding:12px; gap:12px; }
.ext-col-center { flex:1; min-width:0; }
.ext-pool-wrap { flex:1; min-height:0; display:flex; }

/* workspace tabs */
.work-tabs { display:flex; align-items:center; gap:4px; padding:8px 20px 0; background:var(--panel); border-bottom:1px solid var(--border); flex-shrink:0; }
.work-tab { position:relative; border:none; background:transparent; color:var(--text); padding:8px 14px 10px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; }
.work-tab.active { color:var(--accent); }
.work-tab.active::after { content:''; position:absolute; left:10px; right:10px; bottom:-1px; height:2px; background:var(--accent); border-radius:2px 2px 0 0; }
.work-tab-badge { margin-left:5px; padding:1px 6px; border-radius:999px; background:var(--code-bg); color:var(--text); font-size:10px; }
.work-tab.active .work-tab-badge { background:var(--accent-bg); color:var(--accent); }

/* dept/product cascader */
.dept-product-cascader { display:flex; flex-direction:column; gap:8px; }
.ai-compose { border:1px solid var(--accent-border); border-radius:10px; background:linear-gradient(145deg,var(--panel),rgba(47,125,246,.045)); overflow:hidden; flex-shrink:0; }
.ai-compose-head { display:flex; align-items:center; gap:7px; padding:8px 9px 5px; color:var(--text-h); font-size:11px; font-weight:700; }
.ai-compose-mark { width:19px; height:19px; display:flex; align-items:center; justify-content:center; border-radius:6px; background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; font-size:10px; }
.ai-compose textarea { width:100%; min-height:58px; padding:5px 9px; border:none; outline:none; resize:vertical; background:transparent; color:var(--text-h); font:11px/1.5 var(--sans); }
.ai-compose-actions { display:flex; align-items:center; justify-content:space-between; gap:6px; padding:5px 7px 7px; }
.ai-compose-hint { color:var(--text); font-size:9px; }
.ai-plan { margin:0 7px 7px; padding:6px; border:1px solid var(--border); border-radius:7px; background:var(--panel); }
.ai-plan-title { display:flex; align-items:center; justify-content:space-between; margin-bottom:5px; color:var(--text-h); font-size:10px; font-weight:700; }
.ai-plan-list { list-style:none; margin:0 0 6px; padding:0; display:flex; flex-direction:column; gap:3px; }
.ai-plan-list li { display:flex; align-items:center; gap:5px; padding:4px 5px; border-radius:5px; background:var(--bg); color:var(--text-h); font-size:10px; }
.ai-plan-list .reason { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
.ai-plan-list .version { margin-left:auto; color:var(--accent); font:9px var(--mono); }
.dp-row { position:relative; }
.dp-trigger { position:relative; }
.dp-btn { width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px; background:var(--panel); border:1px solid var(--border); border-radius:8px; font-size:13px; color:var(--text-h); cursor:pointer; transition:border-color .15s, box-shadow .15s; }
.dp-btn:hover { border-color:var(--accent-border); }
.dp-btn:disabled { cursor:not-allowed; opacity:.6; }
.dp-trigger.open .dp-btn { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg); }
.dp-btn-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dp-caret { width:14px; height:14px; fill:none; stroke:var(--text); stroke-width:2; transition:transform .15s; }
.dp-trigger.open .dp-caret { transform:rotate(180deg); }
.dp-popover { position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:40; background:var(--panel); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); display:flex; flex-direction:column; max-height:320px; overflow:hidden; }
.dept-popover { min-width:280px; }
.dp-list { list-style:none; margin:0; padding:6px; overflow-y:auto; max-height:260px; }
.dp-list-row { display:flex; align-items:center; gap:6px; padding:7px 8px; border-radius:6px; cursor:pointer; font-size:13px; color:var(--text-h); user-select:none; }
.dp-list-row:hover { background:var(--accent-bg); }
.dp-list-row.active { background:var(--accent-bg); color:var(--accent); font-weight:600; }
.dp-twisty { width:16px; height:16px; display:inline-flex; align-items:center; justify-content:center; color:var(--text); }
.dp-twisty svg { width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:2; transition:transform .15s; }
.dp-twisty.open svg { transform:rotate(90deg); }
.dp-twisty-placeholder { width:16px; height:16px; display:inline-block; }
.dp-list-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dp-list-dept { font-size:11px; color:var(--text); }
.dp-empty { padding:18px; text-align:center; color:var(--text); font-size:12px; }
.dp-popover-footer { border-top:1px solid var(--border); padding:6px; display:flex; justify-content:flex-end; }
.dp-link-btn { border:none; background:transparent; color:var(--accent); font-size:12px; cursor:pointer; padding:4px 8px; border-radius:4px; }
.dp-link-btn:hover { background:var(--accent-bg); }
.dp-breadcrumb { display:flex; flex-wrap:wrap; align-items:center; gap:2px; font-size:12px; color:var(--text); padding:2px 2px 0; }
.dp-crumb { display:inline-flex; align-items:center; gap:2px; }
.dp-sep { width:12px; height:12px; fill:none; stroke:var(--text); stroke-width:2; opacity:.6; }

/* capability pool */
.capability-pool { display:flex; flex-direction:column; height:100%; min-height:0; }
.pool-search { position:relative; margin-bottom:8px; }
.pool-search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; fill:none; stroke:var(--text); stroke-width:2; pointer-events:none; }
.pool-search input { width:100%; box-sizing:border-box; padding:7px 10px 7px 30px; border:1px solid var(--border); border-radius:8px; background:var(--panel); font-size:12px; color:var(--text-h); outline:none; transition:border-color .15s, box-shadow .15s; }
.pool-search input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg); }
.pool-types { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
.pool-type-chip { border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:12px; padding:3px 10px; border-radius:999px; cursor:pointer; transition:all .15s; }
.pool-type-chip:hover { border-color:var(--accent-border); }
.pool-batch { display:flex; align-items:center; gap:6px; margin-bottom:8px; padding:6px 8px; border:1px solid var(--border); border-radius:8px; background:var(--panel); }
.pool-batch-summary { margin-right:auto; font-size:11px; color:var(--text); }
.pool-batch-check { display:inline-flex; align-items:center; gap:5px; color:var(--text-h); font-size:11px; cursor:pointer; user-select:none; }
.pool-batch-check input, .pool-card-check { width:14px; height:14px; margin:0; accent-color:var(--accent); cursor:pointer; flex-shrink:0; }
.pool-batch-check input:disabled, .pool-card-check:disabled { cursor:not-allowed; }
.pool-batch-btn { border:none; background:transparent; color:var(--accent); font:inherit; font-size:11px; cursor:pointer; padding:3px 5px; border-radius:4px; }
.pool-batch-btn:hover:not(:disabled) { background:var(--accent-bg); }
.pool-batch-btn:disabled { color:var(--text); opacity:.45; cursor:not-allowed; }
.pool-list { flex:1; overflow-y:auto; min-height:0; padding-right:2px; }
.pool-empty { padding:24px 8px; text-align:center; color:var(--text); font-size:12px; }
.scope-ready-empty { padding:32px 14px; text-align:center; color:var(--text); }
.scope-ready-icon { font-size:30px; opacity:.5; margin-bottom:8px; }
.scope-ready-title { margin:0 0 4px; color:var(--text-h); font-size:12px; font-weight:600; }
.scope-ready-sub { margin:0; font-size:11px; line-height:1.55; opacity:.85; }
.pool-group { margin-bottom:10px; }
.pool-group-head { display:flex; align-items:center; gap:6px; padding:4px 2px; font-size:11px; color:var(--text); }
.pool-group-tag { width:16px; height:16px; border-radius:4px; color:#fff; font-size:10px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; }
.pool-group-title { font-weight:600; color:var(--text-h); }
.pool-group-count { margin-left:auto; }
.pool-card { padding:8px 10px; margin-bottom:6px; background:var(--panel); border:1px solid var(--border); border-left-width:3px; border-radius:8px; cursor:pointer; transition:border-color .15s, box-shadow .15s, transform .05s; }
.pool-card:hover { border-color:var(--accent-border); box-shadow:0 4px 12px rgba(22,34,51,0.06); }
.pool-card.is-selected { border-color:var(--accent); background:var(--accent-bg); }
.pool-card.is-skill { border-left-color:var(--accent); }
.pool-card.is-command { border-left-color:#16a34a; }
.pool-card.is-agent { border-left-color:var(--accent-2); }
.pool-card.is-offline { opacity:.5; }
.pool-card.is-deprecated { opacity:.75; }
.pool-card-head { display:flex; align-items:center; gap:6px; margin-bottom:3px; }
.pool-card-check { margin-right:1px; }
.pool-card-icon { width:18px; height:18px; border-radius:4px; color:#fff; font-size:10px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.pool-card-name { font-size:13px; font-weight:600; color:var(--text-h); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
.pool-card-version { max-width:104px; font-size:10px; color:var(--text-h); background:var(--code-bg); padding:2px 4px; border:1px solid var(--border); border-radius:4px; flex-shrink:0; cursor:pointer; }
.pool-card-version:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-bg); }
.pool-card-ver-tag { font-size:10px; color:var(--text); background:var(--code-bg); padding:2px 5px; border-radius:4px; flex-shrink:0; }
.pool-card-desc { margin:0; font-size:11px; color:var(--text); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.pool-card-meta { display:flex; align-items:center; gap:6px; margin-top:4px; font-size:10px; color:var(--text); }
.pool-card-files { opacity:.8; }
.pool-badge { padding:1px 5px; border-radius:4px; font-size:10px; font-weight:600; }
.pool-badge.warn { color:#b45309; background:rgba(180,83,9,0.12); }
.pool-badge.danger { color:#b91c1c; background:rgba(185,28,28,0.12); }
.pool-card-action { margin-left:auto; font-size:10px; font-weight:600; color:var(--text); }
.pool-card-action.active { color:var(--accent); }

/* package folder view */
.pkg-view { height:100%; overflow-y:auto; padding:16px 20px; }
.pkg-tree-head { display:flex; align-items:baseline; gap:10px; margin-bottom:12px; }
.pkg-root-name { font-size:16px; font-weight:700; color:var(--text-h); }
.pkg-root-meta { font-size:12px; color:var(--text); }
.pkg-root-level { color:var(--accent); background:var(--accent-bg); padding:1px 6px; border-radius:4px; font-size:11px; font-weight:600; margin-right:2px; }
.pkg-root-ver { color:var(--text-h); font-weight:600; }
.pkg-root-draft { color:var(--accent); background:var(--accent-bg); padding:1px 6px; border-radius:4px; font-size:11px; }
.pkg-root-org { color:var(--accent-2); font-weight:600; }
.pkg-root-scn { color:#15803d; font-weight:600; }
.pkg-root-act { color:#b45309; font-weight:600; }
.pkg-tree, .pkg-items, .pkg-files { list-style:none; margin:0; padding:0; }
.pkg-folder-li { margin-bottom:8px; }
.pkg-folder-row { display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:6px; cursor:pointer; user-select:none; font-size:13px; color:var(--text-h); background:var(--code-bg); }
.pkg-folder-row:hover { background:var(--accent-bg); }
.pkg-folder-icon { font-size:15px; }
.pkg-folder-name { font-weight:600; flex:1; }
.pkg-folder-count { font-size:11px; color:var(--text); background:var(--panel); padding:1px 7px; border-radius:999px; }
.pkg-items { padding-left:22px; border-left:1px dashed var(--border); margin-left:14px; margin-top:4px; }
.pkg-item-li { margin-bottom:2px; }
.pkg-item-row { display:flex; align-items:center; gap:6px; padding:5px 8px; border-radius:6px; font-size:12px; color:var(--text-h); }
.pkg-item-row:hover { background:var(--bg); }
.pkg-item-icon { width:18px; height:18px; border-radius:4px; color:#fff; font-size:10px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.pkg-item-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
.pkg-item-ver { font-size:10px; color:var(--text); background:var(--code-bg); padding:1px 5px; border-radius:4px; }
.pkg-badge { font-size:10px; padding:1px 5px; border-radius:4px; font-weight:600; }
.pkg-badge.warn { color:#b45309; background:rgba(180,83,9,0.12); }
.pkg-item-del { border:none; background:transparent; color:var(--text); font-size:15px; line-height:1; cursor:pointer; width:18px; height:18px; border-radius:4px; opacity:0; transition:opacity .15s; }
.pkg-item-row:hover .pkg-item-del { opacity:1; }
.pkg-item-del:hover { background:rgba(185,28,28,0.12); color:#b91c1c; }
.pkg-files { padding-left:22px; margin-left:14px; margin-top:2px; margin-bottom:4px; }
.pkg-file-row { display:flex; align-items:center; gap:6px; padding:3px 8px; font-size:11px; color:var(--text); border-radius:4px; }
.pkg-file-row.clickable { cursor:pointer; }
.pkg-file-row.clickable:hover { background:var(--bg); color:var(--text-h); }
.pkg-file-row.dir { font-weight:600; }
.pkg-file-row:hover { background:var(--bg); }
.pkg-file-icon { font-size:12px; }
.pkg-file-name { font-family:var(--mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
.pkg-file-caret { width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:2; opacity:.5; transition:transform .15s; }
.pkg-file-caret.open { transform:rotate(90deg); opacity:1; }
.pkg-file-viewer { margin:2px 0 4px 22px; border:1px solid var(--border); border-radius:6px; background:var(--code-bg); overflow:hidden; }
.pkg-file-loading, .pkg-file-error { padding:10px 12px; font-size:11px; color:var(--text); }
.pkg-file-error { color:#b91c1c; }
.pkg-file-viewer-head { display:flex; align-items:center; justify-content:space-between; padding:4px 10px; border-bottom:1px solid var(--border); background:var(--panel); }
.pkg-file-viewer-path { font-family:var(--mono); font-size:10px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pkg-file-copy { border:none; background:transparent; color:var(--accent); font-size:10px; cursor:pointer; padding:1px 6px; border-radius:3px; }
.pkg-file-copy:hover { background:var(--accent-bg); }
.pkg-file-content { margin:0; padding:10px 12px; font-family:var(--mono); font-size:11px; line-height:1.55; color:var(--text-h); overflow-x:auto; white-space:pre; max-height:280px; overflow-y:auto; }
.pkg-empty-folder { padding:6px 8px; font-size:11px; color:var(--text); opacity:.7; }
.pkg-empty { margin-top:40px; text-align:center; color:var(--text); }
.pkg-empty-icon { font-size:40px; opacity:.4; }
.pkg-empty p { font-size:12px; margin:8px 0 0; max-width:360px; }

/* dialog */
.ext-overlay { position:fixed; inset:0; z-index:1000; background:rgba(22,34,51,0.45); display:flex; align-items:center; justify-content:center; padding:24px; }
.ext-dialog { width:640px; max-width:100%; max-height:88vh; display:flex; flex-direction:column; background:var(--panel); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
.ext-head { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border); font-size:15px; color:var(--text-h); }
.ext-close { border:none; background:transparent; font-size:22px; line-height:1; color:var(--text); cursor:pointer; padding:0 4px; border-radius:4px; }
.ext-close:hover { background:var(--code-bg); }
.ext-stepper { display:flex; padding:12px 18px; border-bottom:1px solid var(--border); gap:4px; }
.ext-step { flex:1; display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text); }
.ext-step::after { content:''; flex:1; height:1px; background:var(--border); margin:0 6px; }
.ext-step:last-child::after { display:none; }
.ext-step-no { width:20px; height:20px; border-radius:50%; border:1px solid var(--border); display:inline-flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; }
.ext-step.active { color:var(--accent); font-weight:600; }
.ext-step.active .ext-step-no { border-color:var(--accent); background:var(--accent); color:#fff; }
.ext-step.done .ext-step-no { background:var(--accent); border-color:var(--accent); color:#fff; }
.ext-body { flex:1; overflow-y:auto; padding:18px; }
.ext-step-panel { display:flex; flex-direction:column; gap:14px; }
.ext-field { display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--text-h); }
.ext-field span em { color:#b91c1c; font-style:normal; margin-left:2px; }
.ext-field input, .ext-field select, .ext-field textarea { padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; color:var(--text-h); background:var(--panel); outline:none; font-family:inherit; resize:vertical; }
.ext-field input:focus, .ext-field select:focus, .ext-field textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg); }
.ext-field-hint { margin:0; font-size:11px; color:var(--text); opacity:.8; }
.ext-icon-row { display:flex; gap:6px; flex-wrap:wrap; }
.ext-icon-opt { width:34px; height:34px; border:1px solid var(--border); background:var(--panel); border-radius:8px; font-size:18px; cursor:pointer; }
.ext-icon-opt.active { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg); }
.ext-pkg-preview { display:flex; align-items:center; gap:12px; padding:12px; background:var(--bg); border:1px solid var(--border); border-radius:8px; }
.ext-pkg-preview-icon { width:44px; height:44px; border-radius:10px; background:var(--panel); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:22px; }
.ext-pkg-preview h3 { margin:0; font-size:15px; color:var(--text-h); }
.ext-pkg-preview p { margin:4px 0 0; font-size:11px; color:var(--text); }
.ext-folders-preview { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }

/* toast */

.task-modal-lg { width:1240px; max-width:96vw; max-height:90vh; }
.task-toolbar { flex-wrap:wrap; gap:8px; }
.task-user { color:var(--text); font-size:11px; }
.task-table { width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed; }
.task-table th, .task-table td { padding:10px; text-align:left; border-bottom:1px solid var(--border); vertical-align:top; }

/* visual redesign v2 — extension studio */
:root {
  --text:#667085;
  --text-h:#101828;
  --bg:#f3f5f9;
  --panel:#ffffff;
  --border:#e4e7ec;
  --code-bg:#f7f8fa;
  --accent:#2f7df6;
  --accent-2:#2563eb;
  --accent-bg:rgba(47,125,246,.09);
  --accent-border:rgba(47,125,246,.28);
  --shadow:0 12px 32px rgba(16,24,40,.08);
  --shadow-sm:0 2px 8px rgba(16,24,40,.06);
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:16px;
}
body { background:var(--bg); letter-spacing:.002em; }
.app { background:radial-gradient(circle at 78% -15%,rgba(47,125,246,.09),transparent 36%),var(--bg); }
.review-banner { padding:6px 18px; background:#f7fbff; border-bottom:1px solid #e1edff; color:#4776ae; font-size:11px; text-align:left; }
.ext-toolbar { min-height:66px; padding:10px 20px; border-bottom:1px solid var(--border); box-shadow:0 1px 0 rgba(16,24,40,.02); }
.ext-toolbar-left { gap:12px; }
.ext-brand-mark { width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:10px; background:linear-gradient(145deg,#4290ff,#246fe5); color:#fff; font-size:12px; font-weight:800; letter-spacing:.04em; box-shadow:0 7px 18px rgba(47,125,246,.25); }
.ext-title-stack { display:flex; flex-direction:column; gap:1px; padding-right:6px; }

.ext-scn-chip { max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:3px 7px; border:1px solid #b9d8c5; border-radius:6px; background:#f2faf5; color:#15803d; font-size:9px; font-weight:700; }
.scope-toggle-btn { border:1px solid var(--border); background:var(--panel); color:var(--text); font:600 9px var(--sans); padding:2px 7px; border-radius:6px; cursor:pointer; transition:all .15s; }

.scope-toggle-btn:disabled { opacity:.45; cursor:not-allowed; }
.ext-btn { min-height:32px; border-radius:8px; padding:6px 12px; font-weight:600; transition:transform .15s,box-shadow .15s,border-color .15s,background .15s; }
.ext-btn:hover:not(:disabled) { transform:translateY(-1px); }

function pathStartsWith(child, parent) {
  if (parent.length > child.length) return false;
  return parent.every((s,i)=>child[i]===s);
}
function fetchProductTree(deptPath) {
  if (!deptPath.length) return JSON.parse(JSON.stringify(mockProductTree));
  const m = mockProductTree.filter(p=>pathStartsWith(p.deptPath, deptPath));
  return JSON.parse(JSON.stringify(m.length?m:mockProductTree));
}
function fetchCapabilities(opts) {
  let list = mockCapabilities.slice();
  if (opts.deptPath && opts.deptPath.length) list = list.filter(c=>pathStartsWith(c.deptPath, opts.deptPath));
  if (opts.productId) list = list.filter(c=>c.productId===opts.productId);
  if (opts.type) list = list.filter(c=>c.type===opts.type);
  const kw = (opts.keyword||'').trim().toLowerCase();
  if (kw) list = list.filter(c=>c.name.toLowerCase().includes(kw)||c.description.toLowerCase().includes(kw)||c.id.toLowerCase().includes(kw));
  return list;
}
function generateFileContent(name, desc, filePath) {
  const lower = filePath.toLowerCase();
  const base = (filePath.split('/').pop()) || filePath;
  if (lower.endsWith('.md')) {
    return ['# '+name,'',desc,'','## 说明','','> 本文件 '+filePath+' 为「'+name+'」能力实体的描述文档。','','## 使用','','- 通过 Extension 编排将该能力加入 skills/、commands/ 或 agents/ 子文件夹。','- 目标组织市场安装后即可按本能力约定调用。',''].join('\n');
  }
  if (lower.endsWith('.sh')) {
    return ['#!/bin/bash','# '+name+' - '+base,'# '+desc,'set -euo pipefail','','WORKDIR="${1:-.}"','echo "['+name+'] start at $WORKDIR"','','# TODO: 在此实现具体逻辑','exit 0',''].join('\n');
  }
  if (lower.endsWith('.py')) {
    return ['"""'+name+' - '+base,'',desc,'"""','from __future__ import annotations','','','def run(*args, **kwargs):','    """入口：由 Extension 运行时调用。"""','    raise NotImplementedError',''].join('\n');
  }
  if (lower.endsWith('.yml')||lower.endsWith('.yaml')) {
    return ['name: "'+name+'"','description: "'+desc+'"','inputs: {}','outputs: {}','entrypoint: ./scripts/run.sh',''].join('\n');
  }
  if (lower.endsWith('.json')) {
    return JSON.stringify({name, description:desc, file:filePath, version:'1.0.0'}, null, 2);
  }
  return '# '+name+' - '+filePath+'\n# '+desc+'\n';
}
function fetchFileContent(capId, filePath) {
  const c = mockCapabilities.find(x=>x.id===capId);
  return generateFileContent(c?.name||capId, c?.description||'', filePath);
}
function validatePackage(pkg) {
  const issues = [];
  if (!pkg.name.trim()) issues.push({level:'error', message:'Extension 名称必填'});
  if (!pkg.version.trim()) issues.push({level:'error', message:'版本号必填'});
  if (!pkg.targetOrg?.id) issues.push({level:'error', message:'请选择发布目标组织'});
  if (!pkg.scenario?.l1 || !pkg.scenario?.l2) issues.push({level:'error', message:'请选择一级场景与二级场景'});
  const cnt = pkg.selection.commands.length + pkg.selection.skills.length + pkg.selection.agents.length;
  if (cnt===0) issues.push({level:'error', message:'至少需要加入一个 command / skill / agent'});
  const allIds = [...pkg.selection.commands, ...pkg.selection.skills, ...pkg.selection.agents];
  for (const id of allIds) {
    const c = mockCapabilities.find(x=>x.id===id);
    if (!c) { issues.push({level:'error', message:'能力 '+id+' 不存在'}); continue; }
    const selectedVersion = pkg.capabilityVersions?.[id] || c.version;
    if (!(c.versions||[c.version]).includes(selectedVersion)) issues.push({level:'error', message:'能力「'+c.name+'」的版本 '+selectedVersion+' 不可用'});
    if (c.status==='deprecated') issues.push({level:'warn', message:'能力「'+c.name+'」已废弃，建议替换'});
    if (c.status==='offline') issues.push({level:'error', message:'能力「'+c.name+'」已下线，无法发布'});
  }
  return { ok: issues.filter(i=>i.level==='error').length===0, issues };
}
const taskStore = ref([]);
function publishExtension(pkg, operator, operatorName, operatorNo) {
  const selectionNames={};
  for(const id of [...pkg.selection.commands, ...pkg.selection.skills, ...pkg.selection.agents]){
    const c=mockCapabilities.find(x=>x.id===id);
    if(c) selectionNames[id]={name:c.name, type:c.type};
  }
  const t = {
    id: 'task-'+Math.random().toString(36).slice(2,10),
    extensionName: pkg.name, version: pkg.version,
    operator: operator||'anonymous', operatorName: operatorName||operator||'anonymous', operatorNo: operatorNo||'',
    createdAt: new Date().toISOString(), status:'success', pkg: JSON.parse(JSON.stringify(pkg)),
    selectionNames,
  };
  taskStore.value = [t, ...taskStore.value];
  return t;
}

/* ---------- shared popover helper ---------- */
function usePopover() {
  const open = ref(false);
  const refEl = ref(null);
  function onDoc(e) {
    if (refEl.value && !refEl.value.contains(e.target)) open.value=false;
  }
  onMounted(()=>document.addEventListener('mousedown', onDoc));
  return { open, refEl };
}

/* ---------- DeptProductCascader ---------- */
const DeptProductCascader = {
  props: { deptPath:Array, productId:{type:String,default:''}, showProduct:{type:Boolean,default:true} },
  emits: ['change','update:deptPath','update:productId'],
  setup(props, { emit }) {
    const deptTree = ref(mockDeptTree);
    const productTree = ref([]);
    const loading = ref(false);
    const expanded = ref({});
    const { open:deptOpen, refEl:deptTriggerRef } = usePopover();
    const { open:productOpen, refEl:productTriggerRef } = usePopover();

    async function loadProductTree() {
      productTree.value = fetchProductTree(props.deptPath||[]);
    }
    function samePath(a,b){ return a.length===b.length && a.every((v,i)=>v===b[i]); }
    const flatDept = computed(()=>{
      const out=[];
      (function walk(nodes, depth, parent){
        for (const n of nodes) {
          const path=[...parent, n.name];
          const isOpen=!!expanded.value[n.id];
          const hasChildren=!!(n.children&&n.children.length);
          out.push({id:n.id,name:n.name,depth,path,hasChildren,expanded:isOpen,selected:samePath(path, props.deptPath||[])});
          if (isOpen && hasChildren) walk(n.children, depth+1, path);
        }
      })(deptTree.value, 0, []);
      return out;
    });
    const flatProduct = computed(()=>{
      const out=[];
      (function walk(nodes, depth){
        for (const n of nodes) {
          out.push({id:n.id,name:n.name,depth,deptLabel:n.deptPath.slice(-1)[0]||'',active:n.id===props.productId});
          if (n.children) walk(n.children, depth+1);
        }
      })(productTree.value, 0);
      return out;
    });
    const deptLabel = computed(()=> (props.deptPath&&props.deptPath.length)?props.deptPath.join(' / '):'全部部门');
    const selectedProductName = computed(()=>{
      if (!props.productId) return '全部产品';
      const find = (nodes)=>{ for (const n of nodes){ if (n.id===props.productId) return n.name; if (n.children){const r=find(n.children); if(r) return r;} } return undefined; };
      return find(productTree.value)||'全部产品';
    });
    const breadcrumb = computed(()=> props.showProduct ? [deptLabel.value, selectedProductName.value] : [deptLabel.value]);
    function onDeptRowClick(row){ if (row.hasChildren && !row.expanded){ expanded.value[row.id]=true; return; } applyDept(row.path); }
    function toggleDeptExpand(row){ expanded.value[row.id]=!row.expanded; }
    function applyDept(path){ emit('update:deptPath', path); emit('update:productId',''); emit('change',{deptPath:path, productId:''}); deptOpen.value=false; loadProductTree(); }
    function clearDept(){ expanded.value={}; applyDept([]); }
    function selectProduct(row){ emit('update:productId', row.id); emit('change',{deptPath:props.deptPath, productId:row.id}); productOpen.value=false; }
    function clearProduct(){ emit('update:productId',''); emit('change',{deptPath:props.deptPath, productId:''}); productOpen.value=false; }
    onMounted(loadProductTree);
    watch(()=>props.deptPath, loadProductTree);
    return { deptTree, productTree, loading, expanded, deptOpen, deptTriggerRef, productOpen, productTriggerRef, flatDept, flatProduct, deptLabel, selectedProductName, breadcrumb, onDeptRowClick, toggleDeptExpand, clearDept, selectProduct, clearProduct };
  },
  template: `
  <div class="dept-product-cascader">
    <div class="dp-row"><div ref="deptTriggerRef" class="dp-trigger" :class="{open:deptOpen}">
      <button type="button" class="dp-btn" @click="deptOpen=!deptOpen"><span class="dp-btn-label" :title="deptLabel">{{ deptLabel }}</span><svg class="dp-caret" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <div v-if="deptOpen" class="dp-popover dept-popover"><ul class="dp-list">
        <li v-for="row in flatDept" :key="row.id" class="dp-list-row" :class="{active:row.selected}" :style="{paddingLeft:(8+row.depth*14)+'px'}" @click="onDeptRowClick(row)">
          <span v-if="row.hasChildren" class="dp-twisty" :class="{open:row.expanded}" @click.stop="toggleDeptExpand(row)"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
          <span v-else class="dp-twisty-placeholder"></span>
          <span class="dp-list-name">{{ row.name }}</span>
        </li>
      </ul><div class="dp-popover-footer"><button type="button" class="dp-link-btn" @click="clearDept">清除</button></div></div>
    </div></div>
    <div v-if="showProduct" class="dp-row"><div ref="productTriggerRef" class="dp-trigger" :class="{open:productOpen}">
      <button type="button" class="dp-btn" :disabled="loading" @click="productOpen=!productOpen"><span class="dp-btn-label" :title="selectedProductName">{{ selectedProductName }}</span><svg class="dp-caret" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <div v-if="productOpen" class="dp-popover product-popover">
        <ul v-if="flatProduct.length" class="dp-list">
          <li v-for="row in flatProduct" :key="row.id" class="dp-list-row" :class="{active:row.active}" :style="{paddingLeft:(8+row.depth*14)+'px'}" @click="selectProduct(row)"><span class="dp-list-name">{{ row.name }}</span><span v-if="row.depth>0" class="dp-list-dept">{{ row.deptLabel }}</span></li>
        </ul>
        <div v-else class="dp-empty">{{ loading?'加载中…':'该部门下暂无产品' }}</div>
        <div class="dp-popover-footer"><button type="button" class="dp-link-btn" @click="clearProduct">清除</button></div>
      </div>
    </div></div>
  </div>`
};

/* ---------- ScenarioCascader ---------- */
const ScenarioCascader = {
  props: {
    scenario: {type:Object, default:()=>({l1:'',l2:''})},
  },
  emits: ['update:scenario','change'],
  setup(props, { emit }) {
    const scenarioTree = ref(mockScenarioTree);
    const scnExpanded = ref({});
    const { open:scnOpen, refEl:scnTriggerRef } = usePopover();
    function buildFlat(tree, expanded, sel){
      const out=[];
      (function walk(nodes, depth, parent){
        for (const n of nodes) {
          const isOpen=!!expanded.value[n.id];
          const hasChildren=!!(n.children&&n.children.length);
          const active = depth===0 ? sel.l1===n.name : (sel.l1===parent[0] && sel.l2===n.name);
          out.push({id:n.id,name:n.name,depth,hasChildren,expanded:isOpen,active,parent});
          if (isOpen && hasChildren) walk(n.children, depth+1, [...parent, n.name]);
        }
      })(tree.value, 0, []);
      return out;
    }
    const flatScn = computed(()=>buildFlat(scenarioTree, scnExpanded, props.scenario));
    const scnLabel = computed(()=> props.scenario.l1 ? (props.scenario.l2 ? props.scenario.l1+' / '+props.scenario.l2 : props.scenario.l1) : '请选择场景');
    function onRowClick(row){
      if (row.depth===0){
        if (row.hasChildren){ scnExpanded.value[row.id]=!row.expanded; return; }
        apply({l1:row.name, l2:''});
      } else {
        apply({l1:row.parent[0], l2:row.name});
      }
    }
    function toggleExpand(row){ scnExpanded.value[row.id]=!row.expanded; }
    function apply(val){ emit('update:scenario', val); emit('change', val); scnOpen.value=false; }
    function clearScn(){ scnExpanded.value={}; apply({l1:'',l2:''}); }
    return { flatScn, scnOpen, scnTriggerRef, scnLabel, onRowClick, toggleExpand, clearScn };
  },
  template: `
  <div class="dept-product-cascader">
    <div class="dp-row"><div ref="scnTriggerRef" class="dp-trigger" :class="{open:scnOpen}">

const CapabilityPool = {
  props: { capabilities:Array, loading:Boolean, selectedIds:Array, scopeReady:{type:Boolean,default:false} },
  emits: ['toggle','bulk-toggle'],
  setup(props, { emit }) {
    const keyword = ref('');
    const activeType = ref('all');
    const typeTabs = [{key:'all',label:'全部'},{key:'skill',label:'Skill'},{key:'command',label:'Command'},{key:'agent',label:'Agent'}];
    const selectedSet = computed(()=> new Set(props.selectedIds||[]));
    const filtered = computed(()=>{
      const kw=keyword.value.trim().toLowerCase();
      return props.capabilities.filter(c=>{
        if (activeType.value!=='all' && c.type!==activeType.value) return false;
        if (!kw) return true;
        return c.name.toLowerCase().includes(kw)||c.description.toLowerCase().includes(kw)||c.id.toLowerCase().includes(kw);
      });
    });
    const grouped = computed(()=>{
      const order=['skill','command','agent'];
      return order.map(t=>({type:t, items:filtered.value.filter(c=>c.type===t)})).filter(g=>g.items.length>0);
    });
    const selectableFiltered = computed(()=>filtered.value.filter(c=>c.status!=='offline'));
    const selectedFilteredCount = computed(()=>selectableFiltered.value.filter(c=>selectedSet.value.has(c.id)).length);
    const allFilteredSelected = computed(()=>selectableFiltered.value.length>0 && selectedFilteredCount.value===selectableFiltered.value.length);
    const canBulkAdd = computed(()=>selectableFiltered.value.some(c=>!selectedSet.value.has(c.id)));
    const canBulkRemove = computed(()=>selectableFiltered.value.some(c=>selectedSet.value.has(c.id)));

              </li>
              <li v-if="expandedFiles[mdFileKey(cap)]" class="pkg-file-viewer">

/* ---------- PublishExtensionDialog ---------- */
const PublishExtensionDialog = {
  components: { OrgTreeSelect, ScenarioCascader },
  props: { modelValue:Boolean, pkg:Object, capabilities:Array, operator:String, operatorName:String, operatorNo:String },
  emits: ['update:modelValue','published'],
  setup(props, { emit }) {
    const ICON_OPTIONS=['🧩','⚙️','🚀','📦','🔧','🛠️','✨','🤖'];
    const step = ref(0);
    const steps=['元信息','清单确认','发布'];
    const validating=ref(false); const issues=ref(null);
    const publishing=ref(false); const publishError=ref(''); const resultTask=ref(null);
    const publishStage=ref(0); const publishStages=['生成包清单','上传至目标组织','生成组织市场条目']; const copied=ref(false);
    const localPkg = ref(JSON.parse(JSON.stringify(props.pkg)));
    const capById = computed(()=>{ const m={}; (props.capabilities||[]).forEach(c=>m[c.id]=c); return m; });
    const folders = computed(()=>[
      {label:'commands/', ids:localPkg.value.selection.commands},
      {label:'skills/', ids:localPkg.value.selection.skills},
      {label:'agents/', ids:localPkg.value.selection.agents},
    ]);
    const totalCount = computed(()=> localPkg.value.selection.commands.length+localPkg.value.selection.skills.length+localPkg.value.selection.agents.length);
    const manifestJson = computed(()=> JSON.stringify({
      name:localPkg.value.name, version:localPkg.value.version, description:localPkg.value.description, level:localPkg.value.level,
      targetOrg: localPkg.value.targetOrg?{id:localPkg.value.targetOrg.id,name:localPkg.value.targetOrg.name}:null,
      scenario: localPkg.value.scenario||{l1:'',l2:''},
      structure:{
        commands:localPkg.value.selection.commands.map(id=>({id,version:localPkg.value.capabilityVersions[id]})),
        skills:localPkg.value.selection.skills.map(id=>({id,version:localPkg.value.capabilityVersions[id]})),
        agents:localPkg.value.selection.agents.map(id=>({id,version:localPkg.value.capabilityVersions[id]})),
      },
    }, null, 2));
    const canNext = computed(()=>{
      if (step.value===0) return localPkg.value.name.trim().length>0 && localPkg.value.version.trim().length>0 && !!localPkg.value.targetOrg && !!localPkg.value.scenario?.l1 && !!localPkg.value.scenario?.l2;
      if (step.value===1) return issues.value?.ok ?? false;
      return true;
    });
    function onScnChange(scn){ localPkg.value={...localPkg.value, scenario:scn||{l1:'',l2:''}}; }
    function close(){ if (publishing.value) return; emit('update:modelValue', false); }
    function reset(){
      step.value=0; issues.value=null; resultTask.value=null; publishError.value=''; publishStage.value=0; copied.value=false;
      localPkg.value=JSON.parse(JSON.stringify(props.pkg));
      if(!localPkg.value.version) localPkg.value.version='1.0.0';
      const resolved={...(localPkg.value.capabilityVersions||{})};
      const ids=[...localPkg.value.selection.commands,...localPkg.value.selection.skills,...localPkg.value.selection.agents];
      ids.forEach(id=>{
        const c=capById.value[id];
        const available=c?.versions||[c?.version].filter(Boolean);
        if(!resolved[id]||!available.includes(resolved[id])) resolved[id]=available[0]||'1.0.0';
      });
      localPkg.value.capabilityVersions=resolved;
    }
    function onOrgChange(org){ localPkg.value={...localPkg.value, targetOrg: org||undefined}; }
    async function runValidation(){ validating.value=true; try { issues.value=validatePackage(localPkg.value); } finally { validating.value=false; } }
    async function next(){ if(step.value===0){ step.value=1; await runValidation(); return; } if(step.value===1){ if(!issues.value?.ok) return; step.value=2; await doPublish(); return; } }
    function prev(){ if(step.value>0 && !publishing.value) step.value-=1; }
    async function doPublish(){
      publishing.value=true; publishError.value=''; resultTask.value=null; publishStage.value=0;
      for (let i=0;i<publishStages.length;i++){ publishStage.value=i; await new Promise(r=>setTimeout(r, 500+Math.random()*500)); }
      try {
        const t = publishExtension(localPkg.value, props.operator, props.operatorName, props.operatorNo);
        resultTask.value=t; publishStage.value=publishStages.length; emit('published', t);
      } catch(e){ publishError.value=String(e); } finally { publishing.value=false; }
    }
    async function retry(){ step.value=2; await doPublish(); }
    function copyInstallCmd(){ const cmd='fuyao install '+localPkg.value.name+'@'+localPkg.value.version+' --org '+(localPkg.value.targetOrg?.id||''); navigator.clipboard&&navigator.clipboard.writeText(cmd); copied.value=true; setTimeout(()=>copied.value=false,1500); }
    watch(()=>props.modelValue, (v)=>{ if(v) reset(); });
    return { ICON_OPTIONS, step, steps, validating, issues, publishing, publishError, resultTask, publishStage, publishStages, copied, localPkg, capById, folders, totalCount, manifestJson, canNext, close, onOrgChange, onScnChange, next, prev, retry, copyInstallCmd, typeShort, typeColor };
  },
  template: `
  <teleport to="body">
    <div v-if="modelValue" class="ext-overlay" @click.self="close">
      <div class="ext-dialog" role="dialog">
        <div class="ext-head"><strong>打包并发布 Extension</strong><button type="button" class="ext-close" :disabled="publishing" @click="close">×</button></div>
        <div class="ext-stepper">
