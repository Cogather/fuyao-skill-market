<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Extension 发布模块（原型）</title>
<style>
:root{
  --text:#667085; --text-h:#101828; --bg:#f3f5f9; --panel:#fff;
  --border:#e4e7ec; --code-bg:#f7f8fa;
  --accent:#2f7df6; --accent-2:#2563eb; --accent-bg:rgba(47,125,246,.09); --accent-border:rgba(47,125,246,.28);
  --skill:#2f7df6; --command:#16a34a; --agent:#7552ff;
  --warn:#b45309; --danger:#dc2626; --ok:#16a34a;
  --shadow:0 12px 32px rgba(16,24,40,.08); --shadow-sm:0 2px 8px rgba(16,24,40,.06); --shadow-pop:0 24px 60px rgba(16,24,40,.22);
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --sans:system-ui,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;
  --mono:ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--text);background:var(--bg);letter-spacing:.002em;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
h1,h2,h3,h4{margin:0;color:var(--text-h);font-weight:700}
p{margin:0}
.app{height:100vh;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(circle at 80% -12%,rgba(47,125,246,.08),transparent 34%),var(--bg)}
.topbar{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 18px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
.brand{width:30px;height:30px;border-radius:8px;background:linear-gradient(145deg,#4290ff,#246fe5);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.brand-stack{display:flex;flex-direction:column}
.brand-k{color:#98a2b3;font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}
.brand-t{color:var(--text-h);font-size:13px;font-weight:700}
.spacer{flex:1}
.sel{height:30px;border:1px solid var(--border);border-radius:7px;background:var(--panel);color:var(--text-h);font-size:12px;font-weight:600;padding:0 9px;outline:none}
.sel:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text-h);font-size:10px;font-weight:600}
.note{font-size:11px;color:#98a2b3}
.btn{display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:5px 11px;border:1px solid transparent;border-radius:7px;font-size:12px;font-weight:600;color:var(--text-h);background:var(--panel);transition:transform .15s,box-shadow .15s,border-color .15s,background .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{border-color:#dfe3e8}
.btn-ghost:hover:not(:disabled){border-color:var(--accent-border);background:#f6f9ff}
.btn-primary{background:linear-gradient(135deg,#3b87f7,#276fdf);color:#fff;box-shadow:0 4px 10px rgba(47,125,246,.18)}
.btn-soft{border-color:#dfe3e8;background:#f6f9ff;color:#2868c7}
.btn-success{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 4px 10px rgba(22,163,74,.2)}
.btn-danger{border-color:#fca5a5;background:#fff;color:var(--danger)}
.btn-sm{min-height:26px;padding:3px 9px;font-size:11px;border-radius:6px}
.btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.body{flex:1;min-height:0;overflow:auto}
.navbar{display:flex;align-items:center;gap:2px;padding:8px 16px 0;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.navbar-item{padding:8px 14px;border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--text);border-bottom:2px solid transparent;white-space:nowrap;border-radius:6px 6px 0 0}
.navbar-item:hover{color:var(--text-h);background:#f6f9ff}
.navbar-item.active{color:var(--accent);border-bottom-color:var(--accent)}
.nav-div{width:1px;height:20px;background:var(--border);margin:0 6px;flex-shrink:0;align-self:center}
.content{flex:1;min-width:0;overflow:auto}
/* config page shared */
.cfg-wrap{padding:16px 18px 40px;max-width:1320px;margin:0 auto}
.cfg-hero h1{font-size:18px;font-weight:800}.cfg-hero p{font-size:12px;color:#667085;margin-top:3px}
.summary-strip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:#fff;box-shadow:var(--shadow-sm);margin:12px 0}
.sm-metrics{display:flex;gap:26px}
.sm-metrics>div{display:grid;gap:2px}
.sm-metrics strong{color:var(--accent);font-size:20px;font-weight:800}
.sm-metrics span{color:#7a879b;font-size:11px;font-weight:700}
.taxonomy-grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:12px;align-items:start}
@media(max-width:900px){.taxonomy-grid{grid-template-columns:1fr}}
.panel-card{border:1px solid var(--border);border-radius:var(--r-md);background:#fff;box-shadow:var(--shadow-sm);overflow:hidden}
.panel-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid #eef0f3;background:#f7f8fa}
.panel-card-head h3{font-size:13px;font-weight:700}
.panel-card-head .sub{font-size:11px;color:#98a2b3}
.panel-card-body{padding:8px}
.tree-node{display:flex;align-items:center;gap:6px;padding:7px 6px;border-radius:7px;border:1px solid transparent;margin-bottom:2px}
.tree-node:hover{background:#f6f9ff;border-color:var(--border)}
.tree-node.active{background:var(--accent-bg);border-color:var(--accent-border)}
.tn-main{flex:1;display:grid;gap:1px;background:transparent;border:0;text-align:left;cursor:pointer;color:var(--text-h);padding:0}
.tn-main strong{font-size:13px}.tn-main small{font-size:10px;color:#98a2b3}
.list-row{display:flex;align-items:center;gap:8px;padding:8px;border-radius:7px;border:1px solid transparent;margin-bottom:2px}
.list-row:hover{background:#f6f9ff;border-color:var(--border)}
.lr-main{flex:1;display:grid;gap:1px}
.lr-main strong{font-size:13px;color:var(--text-h)}.lr-main small{font-size:10px;color:#98a2b3}
.empty-mini{padding:14px;text-align:center;color:#98a2b3;font-size:11px}
.icon-btn{width:26px;height:26px;border:1px solid var(--border);border-radius:6px;background:#fff;color:#667085;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.icon-btn:hover{border-color:var(--accent-border);color:var(--accent);background:var(--accent-bg)}
.icon-btn.danger:hover{border-color:#fca5a5;color:var(--danger);background:#fff5f5}
.card{border:1px solid var(--border);border-radius:var(--r-md);background:var(--panel);box-shadow:var(--shadow-sm)}
.filter-card{padding:14px;margin-bottom:12px}
.scope-bar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:#fff;box-shadow:var(--shadow-sm);margin:12px 0}
.scope-bar .field{min-width:200px;flex:1;max-width:320px}
.filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
.filter-actions{display:flex;gap:8px}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:11px;font-weight:700;color:#475467}
.field input,.field select{width:100%;height:32px;padding:0 9px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text-h);font-size:12px;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.board{display:flex;flex-direction:column;overflow:hidden}
.board--auto{height:auto}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid #eef0f3}
.toolbar__summary{display:flex;flex-direction:column;gap:2px}
.toolbar__summary strong{font-size:14px;color:var(--text-h)}
.toolbar__summary span{font-size:11px;color:#98a2b3}
.toolbar__actions{display:flex;gap:8px;align-items:center}
.table-wrap{width:100%;overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid #eef0f3;text-align:left;vertical-align:middle}
.tbl th{background:#f7f8fa;color:#475467;font-size:11px;font-weight:700;white-space:nowrap}
.tbl td{color:var(--text-h)}
.tbl tbody tr:hover{background:#f9fbff}
.list-stats{display:flex;gap:10px;margin:12px 0}
.list-stats .stat{flex:1;min-width:120px;padding:11px 14px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--panel);box-shadow:var(--shadow-sm)}
.list-stats .stat b{font-size:18px;color:var(--text-h);font-weight:800}
.list-stats .stat span{display:block;font-size:10px;color:#98a2b3;margin-top:2px}
.hidden{display:none!important}
/* placeholder layout */
.ph-wrap{padding:18px 20px 40px;max-width:1100px;margin:0 auto}
.ph-hero h1{font-size:18px;font-weight:800}
.ph-hero p{font-size:12px;color:#667085;margin-top:3px}
.ph-note{font-size:11px;color:#475467;background:#f6f9ff;border:1px solid #e0e6f0;border-radius:8px;padding:9px 11px;margin:12px 0}
.ph-note b{color:#2868c7}
.ph-layout{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.ph-region{border:1px dashed var(--accent-border);border-radius:9px;background:#fbfcff;padding:11px 13px;min-height:48px}
.ph-region-tag{font-size:10px;font-weight:800;color:var(--accent);background:var(--accent-bg);padding:2px 8px;border-radius:5px;display:inline-block;margin-bottom:5px}
.ph-region-body{font-size:12px;color:var(--text-h)}
.ph-hint{margin-top:14px;font-size:11px;color:#98a2b3}
.hidden{display:none!important}

/* scene list (全景卡片) */
.list-wrap{padding:18px 20px 40px;max-width:1400px;margin:0 auto}
.list-hero{margin-bottom:6px}
.list-hero h1{font-size:20px;font-weight:800}
.list-hero p{font-size:12px;color:#667085;margin-top:3px}
.list-stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.stat{flex:1;min-width:130px;padding:11px 14px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--panel);box-shadow:var(--shadow-sm)}
.stat b{font-size:18px;color:var(--text-h);font-weight:800}
.stat span{display:block;font-size:10px;color:#98a2b3;margin-top:2px}
.stat .d{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.sc-card{border:1px solid var(--border);border-radius:var(--r-md);background:var(--panel);box-shadow:var(--shadow-sm);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,box-shadow .15s,transform .15s}
.sc-card:hover{border-color:var(--accent-border);box-shadow:var(--shadow);transform:translateY(-2px)}
.sc-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.pri{font-size:10px;font-weight:700;color:#6d3bd6;background:#f6f2ff;padding:3px 7px;border-radius:5px;border:1px solid #e4d8fb}
.stp{font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px}
.stp.undef{background:#f1f3f7;color:#6b7280}
.stp.draft{background:#eef2ff;color:#4266d5}
.stp.ing{background:#fff3df;color:#b06a18}
.stp.ready{background:#fff3df;color:#b06a18}
.stp.pub{background:#eaf8f1;color:#27815d}
.sc-card h3{font-size:15px;font-weight:700}
.sc-card .ext{font-size:11px;color:#667085;margin-top:-4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-progress{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid #eef0f3;border-radius:9px;background:#fafcff}
.rdy-line{display:flex;align-items:center;gap:7px}
.rdy-line b{font-size:13px;color:var(--text-h)}
.rdy-line span{font-size:10px;color:#98a2b3}
.rdy-bar{flex:1;height:6px;border-radius:99px;background:#ece9f6;overflow:hidden}
.rdy-bar .fill{height:100%;background:linear-gradient(90deg,#7552ff,#2f7df6)}
.dotline{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.dot{font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;display:inline-flex;align-items:center;gap:4px}
.dot .dd{width:6px;height:6px;border-radius:50%}
.dot.plan{background:#eef2ff;color:#4266d5}.dot.plan .dd{background:#4266d5}
.dot.dev{background:#fff3df;color:#b06a18}.dot.dev .dd{background:#f59e0b}
.dot.live{background:#eaf8f1;color:#27815d}.dot.live .dd{background:#16a34a}
.pub-line{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-h)}
.pub-line .ver{font:700 12px var(--mono);color:var(--ok)}
.pub-line .cnt{color:#98a2b3;font-size:10px}
.sc-foot{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#98a2b3;border-top:1px solid #eef0f3;padding-top:8px;margin-top:auto}
.sc-foot .enter{color:var(--accent);font-weight:600}

/* scene detail */
.detail{display:flex;flex-direction:column;height:100%;min-height:0}
.dt-head{padding:13px 20px 11px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#fff,#f6f9ff);flex-shrink:0}
.dt-head-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dt-head h2{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.ext-name{font-size:14px;font-weight:700;color:var(--text-h);border:1px solid #e0e6f0;border-radius:7px;padding:5px 10px;outline:none;min-width:200px;background:#fff}
.ext-name:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.sp{font-size:11px;font-weight:700;padding:4px 10px;border-radius:7px}
.sp.undef{background:#f1f3f7;color:#6b7280;border:1px solid #e6e8ec}
.sp.draft{background:#eef2ff;color:#4266d5;border:1px solid #d6dcff}
.sp.ing{background:#fff3df;color:#b06a18;border:1px solid #ffe0a3}
.sp.pub{background:#eaf8f1;color:#27815d;border:1px solid #b9e6cd}
.dt-head-sub{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.ext-desc{flex:1;min-width:200px;font-size:12px;color:#475467;border:1px solid #eef0f3;border-radius:7px;padding:6px 9px;background:#fff;outline:none;min-height:32px}
.ext-desc:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.dt-acts{display:flex;gap:4px;flex-wrap:wrap}
.dt-acts .tag{font-size:10px;padding:2px 7px;border-radius:99px;background:#fff7e6;color:#92611a;border:1px solid #ffe0a3}
/* gauge */
.gauge{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:linear-gradient(145deg,#fff,#f6f9ff);margin:13px 20px 0}
.gauge .ring{position:relative;width:54px;height:54px;flex-shrink:0}
.gauge .ring svg{transform:rotate(-90deg)}
.gauge .ring .bg{fill:none;stroke:#ece9f6;stroke-width:6}
.gauge .ring .fg{fill:none;stroke:url(#g);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .4s}
.gauge .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--text-h)}
.gauge .info{flex:1}
.gauge .info b{font-size:14px;color:var(--text-h)}
.gauge .info span{display:block;font-size:11px;color:#98a2b3;margin-top:2px}
.gauge .src{font-size:10px;color:#98a2b3}
.dt-body{flex:1;overflow-y:auto;padding:13px 20px 20px}
.act-grp{border:1px solid var(--border);border-radius:var(--r-md);background:var(--panel);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:11px}
.act-grp-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #eef0f3;background:#f7f8fa}
.act-grp-head .atag{font-size:11px;font-weight:700;color:#92611a;background:#fff7e6;border:1px solid #ffe0a3;padding:3px 9px;border-radius:6px}
.act-grp-head b{font-size:12px;color:var(--text-h)}
.act-grp-head .cnt{margin-left:auto;font-size:10px;color:#98a2b3;background:var(--panel);padding:1px 7px;border-radius:99px;border:1px solid var(--border)}
.act-grp-body{padding:5px}
.cap-row{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;font-size:12px;color:var(--text-h);margin-bottom:2px;border:1px solid transparent}
.cap-row:hover{background:#f6f9ff;border-color:var(--border)}
.cap-row .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap-row .ds{font-size:10px;color:#98a2b3;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap-row .reuse{font-size:9px;font-weight:600;color:#6d3bd6;background:#f6f2ff;padding:1px 5px;border-radius:4px;border:1px solid #e4d8fb}
.ver-sel{height:23px;max-width:76px;padding:0 3px;border:1px solid var(--border);border-radius:5px;background:var(--panel);color:var(--text-h);font-size:10px;font-family:var(--mono)}
.type-tag{width:22px;height:22px;border-radius:5px;color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.type-tag.skill{background:var(--skill)}
.type-tag.command{background:var(--command)}
.type-tag.agent{background:var(--agent)}
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:5px;font-size:9px;font-weight:700}
.status-badge .d{width:5px;height:5px;border-radius:50%}
.sb-plan{background:#eef2ff;color:#4266d5}.sb-plan .d{background:#4266d5}
.sb-dev{background:#fff3df;color:#b06a18}.sb-dev .d{background:#f59e0b}
.sb-live{background:#eaf8f1;color:#27815d}.sb-live .d{background:#16a34a}
.icon-btn{width:24px;height:24px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:#667085;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover{border-color:var(--accent-border);color:var(--accent);background:var(--accent-bg)}
.icon-btn.danger:hover{border-color:#fca5a5;color:var(--danger);background:#fff5f5}
.icon-btn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty{padding:24px;text-align:center;color:#98a2b3;font-size:12px;border:1px dashed var(--border);border-radius:10px;background:#fbfcff}
/* publish + history */
.panel-card{border:1px solid var(--border);border-radius:var(--r-md);background:var(--panel);box-shadow:var(--shadow-sm);overflow:hidden;margin-top:11px}
.panel-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:#f7f8fa;border-bottom:1px solid #eef0f3}
.panel-card-head h3{font-size:12px;font-weight:700}
.panel-card-head .sub{font-size:10px;color:#98a2b3}
.panel-card-body{padding:12px}
.pub-stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pub-stages li{display:flex;align-items:center;gap:7px;font-size:11px;color:#98a2b3}
.pub-stages li.active{color:var(--accent);font-weight:600}
.pub-stages li.done{color:var(--ok)}
.pub-stages .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--border);flex-shrink:0}
.pub-stages li.active .dot{border-color:var(--accent);background:var(--accent);animation:pulse 1.1s infinite}
.pub-stages li.done .dot{border-color:var(--ok);background:var(--ok)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pub-bar{height:5px;background:#ece9f6;border-radius:99px;overflow:hidden;margin-top:8px}
.pub-bar .fill{height:100%;background:linear-gradient(90deg,#7552ff,#2f7df6);transition:width .4s}
.hist-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eef0f3}
.hist-row:last-child{border-bottom:0}
.hist-ver{font:600 12px var(--mono);color:var(--text-h);min-width:46px}
.hist-name{font-size:12px;color:var(--text-h);font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-items{display:flex;gap:4px;flex-wrap:wrap}

function fileContent(m,file){
  const ext=file.split('.').pop();
  const n=m.name,d=m.desc||'';
  if(ext==='md')return `# ${n}\n\n${d}\n\n## 适用场景\n作为 ${TYPE[m.type].n} 能力被 Extension 引用。\n\n## 调用\n\`\`\`yaml\ncapability: ${m.id}\nversion: ${"1.0.0"}\nowner: ${m.owner||'—'}\n\`\`\``;
  if(ext==='sh')return `#!/bin/bash\n# ${n}\n# ${d}\nset -euo pipefail\n\nmain() {\n  echo "[${n}] start"\n  # ... 业务逻辑 ...\n}\n\nmain "$@"`;
  if(ext==='json')return `{\n  "name": "${n}",\n  "version": "${"1.0.0"}",\n  "type": "${m.type}",\n  "status": "${m.status}",\n  "description": "${d}"\n}`;
  if(ext==='py')return `# -*- coding: utf-8 -*-\n\"\"\"${n}\n${d}\n\"\"\"\n\ndef run():\n    # ${n} 实现\n    pass\n\nif __name__ == "__main__":\n    run()`;
  if(ext==='yml'||ext==='yaml')return `name: ${n}\nversion: ${"1.0.0"}\ntype: ${m.type}\nstatus: ${m.status}\ndescription: ${d}`;
  return `${n} - ${file}`;
}

function actPair(c){
  let parent=c.activity||'',child=c.subActivity||'';

    for(const g of ACTIVITY_DICT){ if(g.p===parent){child='';break;} if(g.c.includes(parent)){const t=parent;parent=g.p;child=t;break;} }
  }
  return {parent,child};
}

/* 规划表（关系配置）：一级 → 二级 → 配能力+活动 */

  if(!f.plPrimary||!primaries.includes(f.plPrimary))f.plPrimary=primaries[0]||'';

  if(!f.plScene||!sec.find(s=>s.id===f.plScene))f.plScene=sec[0]?.id||'';
  const sel=SCENES.find(s=>s.id===f.plScene);

  if(f.plAct)rows=rows.filter(r=>r.actP===f.plAct);
  if(f.plType)rows=rows.filter(r=>r.type===f.plType);

    '<label class="field"><span>二级场景</span><select id="pl-scene">'+(sec.length?sec.map(s=>'<option value="'+s.id+'" '+(f.plScene===s.id?'selected':'')+'>'+esc(s.name)+'</option>').join(''):'<option value="">（该一级下无二级）</option>')+'</select></label>'+
    '</div>'+

    '<div class="table-wrap"><table class="tbl"><thead><tr><th>能力</th><th>类型</th><th>活动</th><th>Owner</th><th>操作</th></tr></thead><tbody>'+
    (binds.length?binds.map(({c,m})=>'<tr data-cap="'+c.capId+'"><td><strong>'+esc(m.name)+'</strong></td><td><span class="type-tag '+m.type+'">'+TYPE[m.type].s+'</span></td><td>'+esc(actLabel(c))+'</td><td>'+esc(m.owner||'—')+'</td><td><button class="btn btn-danger btn-sm" data-rm="'+c.capId+'">移除</button></td></tr>').join(''):'<tr><td colspan="5" class="empty-mini">暂未绑定能力</td></tr>')+
    '</tbody></table></div></div>':'<div class="empty" style="margin-bottom:12px">该一级下暂无二级场景，请先在场景管理新建</div>')+

    '<div class="table-wrap"><table class="tbl"><thead><tr><th>一级场景</th><th>二级场景</th><th>活动</th><th>能力</th><th>类型</th><th>Owner</th><th>状态</th></tr></thead><tbody>'+

  function paintChildren(p){const g=ACTIVITY_DICT.find(x=>x.p===p);$('#be-actc').innerHTML='<option value="">（不绑子活动）</option>'+(g?g.c.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join(''): '');}
  function paintList(){
    let list=kw?LIBRARY.filter(m=>(m.name+m.desc).toLowerCase().includes(kw.toLowerCase())):LIBRARY.filter(m=>m.productId===sel.productId);
    if(t)list=list.filter(m=>m.type===t);
    $('#be-list').innerHTML=list.length?list.map(m=>capRowHTML(m,{multi:false,checked:capId===m.id,cur:sel.productId})).join(''):'<div class="empty-mini">无匹配能力（可在能力清单定义新建）</div>';

  $('#be-actp').onchange=e=>{paintChildren(e.target.value);};

  paintList();
  $('#be-ok').onclick=()=>{const actp=$('#be-actp').value,actc=$('#be-actc').value;if(!actp){toast('请先选择父活动');return;}if(!capId){toast('请选择能力');return;}if(sel.caps.some(c=>c.capId===capId&&c.activity===actp&&c.subActivity===actc)){toast('该绑定已存在');return;}sel.caps.push({capId,activity:actp,subActivity:actc});closeModal();renderPlanning();toast('已新增绑定：'+actp+(actc?' / '+actc:''));};
}

/* ============================== 渲染 ============================== */
function render(){
  $('#role-sel').innerHTML=ROLES.map(r=>`<option value="${r.id}" ${state.role===r.id?'selected':''}>${esc(r.name)}</option>`).join('');
  const showDept=['publish','scene','activity','caplib','planning'].includes(state.nav);
  $('#dept-cascader').classList.toggle('hidden',!showDept);
  if(showDept){
    $('#dept-cascader').innerHTML='<button class="cascader-trigger" id="dept-trigger" type="button"><span>'+esc(state.deptPath.join(' / '))+'</span></button>';
    $('#dept-trigger').onclick=()=>openDeptPopover($('#dept-cascader'),dp=>{state.deptPath=dp;const ps=deptUnderProducts(dp);if(!ps.find(p=>p.id===state.productId))state.productId=ps[0]?.id||state.productId;state.activeSceneId=null;render();});
  }
  const prods=deptUnderProducts(state.deptPath);
  if(!prods.find(p=>p.id===state.productId))state.productId=prods[0]?.id||state.productId;
  $('#product-sel').innerHTML=prods.map(p=>`<option value="${p.id}" ${state.productId===p.id?'selected':''}>${esc(p.name)}</option>`).join('');
  const showScope=state.nav==='caplib';
  $('#scope-switch').classList.toggle('hidden',!showScope);
  if(showScope)$('#scope-switch').innerHTML='<button class="'+(state.scope==='产品级'?'active':'')+'" data-scope="产品级">产品级</button><button class="'+(state.scope==='部门级'?'active':'')+'" data-scope="部门级">部门级</button>';
  $('#scope-switch').onclick=e=>{const b=e.target.closest('[data-scope]');if(!b)return;state.scope=b.dataset.scope;render();};
  const showProduct=showDept && (state.nav!=='caplib' || state.scope==='产品级');
  $('#product-sel').classList.toggle('hidden',!showProduct);
  $('#ctx-note').textContent=NOTE_MAP[state.nav]||'';
  renderNavbar();
  if(state.nav==='publish'){if(!state.activeSceneId)renderList();else renderDetail();}
  else if(state.nav==='scene')renderSceneMgmt();
  else if(state.nav==='activity')renderActivityMgmt();
  else if(state.nav==='caplib')renderCapLibMgmt();
  else if(state.nav==='planning')renderPlanning();
  else if(state.nav==='task')renderTask();
  else renderPlaceholder(state.nav);
}

function card(s){
  const st=sceneState(s);
  const r=readyCount(s);
  const bd=statusBreakdown(s);
  const last=s.publishedVersions[0];
  const pct=r.total?Math.round(r.ready/r.total*100):0;
  let prog='';
  if(st==='pub'){
    prog=`<div class="pub-line"><span class="ver">v${esc(last.version)}</span><span class="cnt">最新 · 共 ${s.publishedVersions.length} 版</span></div>
      ${r.total?`<div class="rdy-line" style="margin-top:6px"><span class="dotline"><span class="dot live">${bd['已上线']}已就绪</span>${bd['开发中']?`<span class="dot dev">${bd['开发中']}开发中</span>`:''}</span></div>`:''}`;
  } else if(st==='ing'){
    prog=`<div class="pub-line"><span style="color:#b06a18;font-weight:700">发布中…</span></div>`;
  } else {
    const src=s.extCaps==null?'<span style="color:#98a2b3">（规划表默认）</span>':'';
    prog=`<div class="rdy-line"><b>${r.ready}/${r.total}</b><span>就绪 ${pct}%${src?'':'（已保存草稿）'}</span>${src}<div class="rdy-bar"><div class="fill" style="width:${pct}%"></div></div></div>
      <div class="dotline">${bd['已上线']?`<span class="dot live">${bd['已上线']}已上线</span>`:''}${bd['开发中']?`<span class="dot dev">${bd['开发中']}开发中</span>`:''}${bd['规划中']?`<span class="dot plan">${bd['规划中']}规划中</span>`:''}</div>`;
  }
  const stpCls=st==='pub'?'pub':(st==='ing'?'ing':(st==='draft'?'draft':'undef'));
  return `<div class="sc-card" data-id="${s.id}">
    <div class="sc-top"><span class="pri">${esc(s.primary)}</span><span class="stp ${stpCls}">${STP[st]}</span></div>
    <h3>${esc(s.name)}</h3>

  </div>`;
}

/* ---------- 场景详情 ---------- */
function renderDetail(){
  const s=SCENES.find(x=>x.id===state.activeSceneId);if(!s){state.activeSceneId=null;renderList();return;}
  const prod=productOf(s.productId);
  const r=readyCount(s);const can=canPublish(s);const st=sceneState(s);
  const lastVer=s.publishedVersions[0]?.version;
  const pct=r.total?Math.round(r.ready/r.total*100):0;
  const C=2*Math.PI*22;
  const eff=effCaps(s);
  const groups={};eff.forEach(c=>{(groups[c.activity]=groups[c.activity]||[]).push(c);});
  const acts=Object.keys(groups);
  const srcLabel=s.extCaps==null?'来自规划表（默认）':'Extension 自有配置';
  let foldersHTML;
  if(eff.length){
    foldersHTML=['skill','command','agent'].filter(t=>eff.some(c=>{const m=masterOf(c.capId);return m&&m.type===t;})).map(t=>{
      const items=eff.filter(c=>{const m=masterOf(c.capId);return m&&m.type===t;});
      return '<div class="pkg-folder"><div class="pkg-folder-row"><span class="pkg-folder-icon">📁</span><span class="pkg-folder-name">'+TYPE[t].n+'</span><span class="pkg-folder-count">'+items.length+'</span></div><ul class="pkg-items">'+items.map(c=>pkgItem(s,c,prod)).join('')+'</ul></div>';
    }).join('');
  } else foldersHTML='<div class="empty">暂无能力。点"添加能力"或去规划表关联。</div>';
  $('#body').innerHTML=`<div class="detail">
    <div class="dt-head">
      <div class="dt-head-top">
        <button class="btn btn-ghost btn-sm" id="dt-back">← 场景列表</button>
        <span class="pri">${esc(s.primary)}</span>
        <h2>${esc(s.name)}</h2>
        <div class="spacer"></div>
        ${extDefined(s)?`<input class="ext-name" id="ext-name" value="${esc(s.extension.name)}" placeholder="Extension 名称"/>`:`<button class="btn btn-primary btn-sm" id="ext-define">定义 Extension</button>`}
        <button class="btn btn-soft btn-sm" id="btn-save">保存配置</button>
        <button class="btn ${can?'btn-success':'btn-primary'} btn-sm" id="btn-pub" ${can&&st!=='ing'?'':'disabled'}>${st==='ing'?'发布中…':(can?'一键发布':(extDefined(s)?'待就绪':'待定义'))}</button>
        <span class="sp ${st}">${STP[st]}${st==='pub'?' · v'+lastVer:''}</span>
      </div>
      <div class="dt-head-sub">
        ${extDefined(s)?`<input class="ext-desc" id="ext-desc" value="${esc(s.extension.desc)}" placeholder="Extension 描述"/>`:'<span class="note">先定义 Extension 名称与描述</span>'}
        <div class="dt-acts">${acts.length?acts.map(a=>`<span class="tag">${esc(a)}</span>`).join(''):'<span style="font-size:10px;color:#cbd2dc">无活动标签</span>'}</div>
        <span class="chip">${esc(prod.dept.slice(-1)[0])}</span>
      </div>
    </div>
    ${r.total?`<div class="gauge"><div class="ring"><svg width="54" height="54"><circle class="bg" cx="27" cy="27" r="22"/><circle class="fg" cx="27" cy="27" r="22" stroke-dasharray="${C}" stroke-dashoffset="${C-C*pct/100}"/></svg><div class="pct">${pct}%</div></div><div class="info"><b>${r.ready}/${r.total} 能力就绪</b><span>${r.total-r.ready} 个待开发完成即可发布</span></div><div class="src">${srcLabel}</div></div>`:''}
    <div class="dt-body" id="dt-body">
      <div class="pkg-view">
        <div class="pkg-tree-head">
          <div><span class="pkg-root-name">📦 ${esc(s.extension.name||s.name)}</span><span class="pkg-root-meta">${eff.length} 项能力 · ${srcLabel}</span></div>
          <div style="display:flex;gap:6px">
            ${s.extCaps==null?'':'<button class="btn btn-ghost btn-sm" id="btn-reset">重置为规划表</button>'}
            <button class="btn btn-soft btn-sm" id="btn-add">${icoPlus}添加能力</button>
          </div>
        </div>
        ${s.extCaps==null?'<div class="intro" style="margin:0 0 10px">当前显示<b>规划表映射数据</b>（默认）。在此调整或点"保存配置"后，将以 Extension 自有配置为准（与规划表解耦）。</div>':''}
        ${foldersHTML}
      </div>
      ${s.publishing?'<div class="panel-card"><div class="panel-card-body"><span class="note">发布中…（在发布向导内进行）</span></div></div>':''}
      <div class="panel-card"><div class="panel-card-head"><div><h3>发布历史</h3><span class="sub">同一张发布表的已发布行</span></div><span class="sub">${s.publishedVersions.length} 个版本</span></div><div class="panel-card-body">${history(s)}</div></div>
    </div>
  </div>`;
  $('#dt-back').onclick=()=>{state.activeSceneId=null;render();};
  if(extDefined(s)){
    $('#ext-name').oninput=e=>{s.extension.name=e.target.value;};
    $('#ext-desc').oninput=e=>{s.extension.desc=e.target.value;};
  } else {
    $('#ext-define').onclick=()=>{s.extension={name:s.name+' Extension',desc:''};renderDetail();};
  }
  $('#btn-save').onclick=()=>{forkExt(s);toast('已保存为草稿（全景可查看）');renderDetail();};
  const btnReset=$('#btn-reset');if(btnReset)btnReset.onclick=()=>{s.extCaps=null;toast('已重置为规划表默认');renderDetail();};
  $('#btn-pub').onclick=()=>openPublishWizard(s);
  $('#btn-add').onclick=()=>{forkExt(s);openPicker(s);};
  $('#dt-body').onclick=e=>{
    const rm=e.target.closest('[data-rm]');if(rm){forkExt(s);s.extCaps=s.extCaps.filter(x=>x.capId!==rm.dataset.rm);renderDetail();return;}
    const f=e.target.closest('[data-file]');if(f){const[capId,file]=f.dataset.file.split('|');openFileViewer(capId,file);return;}
    const row=e.target.closest('[data-cap]');if(row){const sib=row.nextElementSibling;if(sib&&sib.classList.contains('pkg-files')){sib.classList.toggle('hidden');row.classList.toggle('open');}}
  };
}
function pkgItem(s,c,prod){
  const m=masterOf(c.capId);if(!m)return'';
  const reuse=m.productId!==s.productId;
  const files=capFiles(m);
  return `<li class="pkg-item-li">
    <div class="pkg-item-row" data-cap="${c.capId}">
      <span class="pkg-caret">▸</span>
      <span class="type-tag ${m.type}">${TYPE[m.type].s}</span>
      <span class="pkg-item-name">${esc(m.name)}</span>
      ${(c.activity||c.subActivity)?`<span class="actag">${esc(actLabel(c))}</span>`:''}
      ${reuse?`<span class="reuse">跨产品·${esc(productOf(m.productId).name)}</span>`:''}
      <span class="status-badge ${SB[m.status]}"><span class="d"></span>${m.status}</span>
      <button class="icon-btn danger" title="移除关联" data-rm="${c.capId}">${icoTrash}</button>
    </div>
    <ul class="pkg-files hidden">${files.map(f=>`<li><div class="pkg-file-row clickable" data-file="${c.capId}|${esc(f)}"><span class="pkg-file-icon">📄</span><span class="pkg-file-name">${esc(f)}</span></div></li>`).join('')}</ul>
  </li>`;
}
function openPublishWizard(s){
  if(!canPublish(s)){toast('未定义 Extension 或存在未就绪能力');return;}
  const ORGS=[{id:'org-fuyao',name:'扶摇组织'},{id:'org-yunshan',name:'云山组织'},{id:'org-haichuan',name:'海川组织'}];
  let step=0,orgId=ORGS[0].id,note='';
  const nextVer=s.publishedVersions.length?('0.'+(parseInt(s.publishedVersions[0].version.split('.')[1])+1)):'0.1';
  const steps=['基本信息','装配确认','目标组织','发布进度','完成'];
  openModal(`<div class="modal lg"><div class="modal-head"><h3>发布 Extension · ${esc(s.name)}</h3><button class="x-btn" data-close>×</button></div>
    <div class="modal-body" id="wiz-body"></div><div class="modal-foot" id="wiz-foot"></div></div>`);
  function paint(){
    $('#wiz-body').innerHTML='<div class="wiz-stepper">'+steps.map((t,i)=>`<div class="wiz-step ${i===step?'active':''} ${i<step?'done':''}"><span class="wn">${i<step?'✓':i+1}</span>${t}</div>`).join('')+'</div>'+panel(step);
    $('#wiz-foot').innerHTML=foot();
  }
  function panel(n){
    if(n===0)return `<div class="field"><span>Extension 名称</span><input id="pw-name" value="${esc(s.extension.name)}"></div>
      <div class="field"><span>描述</span><textarea id="pw-desc" placeholder="本次发布的 Extension 说明">${esc(s.extension.desc)}</textarea></div>
      <div class="field"><span>版本号（自动）</span><div class="ro">v${nextVer}</div><div class="field-hint">基于上一版本自增；上一版本 ${s.publishedVersions.length?'v'+s.publishedVersions[0].version:'无'}。</div></div>`;
    if(n===1){const r=readyCount(s);const reuse=s.caps.filter(c=>{const m=masterOf(c.capId);return m&&m.productId!==s.productId;}).length;return `<div class="pw-preview"><div class="ic">📦</div><div><b>${esc(s.extension.name)}</b><p>v${nextVer} · 含 ${r.total} 个能力${reuse?'（其中 '+reuse+' 个跨产品复用）':''}</p></div></div>
      <ul class="checks">${effCaps(s).map(c=>{const m=masterOf(c.capId);return '<li class="ok"><span class="d"></span>'+TYPE[m.type].n+' · '+esc(m.name)+'</li>';}).join('')}<li class="ok"><span class="d"></span>所有能力已上线，可发布</li></ul>`;}
    if(n===2)return `<div class="field" style="margin-bottom:8px"><span>目标组织</span></div>
      <div class="org-list" id="org-list">${ORGS.map(o=>`<div class="org-row ${orgId===o.id?'active':''}" data-org="${o.id}"><span class="nm">${esc(o.name)}</span><span class="meta">同步至上级组织</span></div>`).join('')}</div>
      <div class="field"><span>发布说明（可选）</span><textarea id="pw-note" placeholder="本次发布变更说明">${esc(note)}</textarea></div>`;
    if(n===3)return `<div class="pub-progress"><ul class="pub-stages" id="ps">${['打包就绪能力','提交同步申请','组织审批','发布到市场'].map((t,i)=>`<li class="${i===0?'active':''}"><span class="dot"></span>${t}</li>`).join('')}</ul><div class="pub-bar"><div class="fill" id="pf" style="width:5%"></div></div></div>`;
    const orgN=ORGS.find(o=>o.id===orgId).name;
    return `<div class="pub-success"><div class="ic">✓</div><h3>已发布 ${esc(s.extension.name)} v${nextVer}</h3><p>已发布至 ${esc(orgN)}，含 ${readyCount(s).total} 个能力。</p></div>`;
  }
  function foot(){
    if(step===0)return `<button class="btn btn-ghost" data-close>取消</button><button class="btn btn-primary" id="wiz-next">下一步</button>`;
    if(step===1)return `<button class="btn btn-ghost" id="wiz-prev">上一步</button><button class="btn btn-primary" id="wiz-next">下一步</button>`;
    if(step===2)return `<button class="btn btn-ghost" id="wiz-prev">上一步</button><button class="btn btn-success" id="wiz-go">确认发布</button>`;
    if(step===3)return `<span class="note">发布中…</span>`;
    return `<button class="btn btn-primary" id="wiz-done">完成</button>`;
  }
  paint();
  $('#wiz-foot').addEventListener('click',e=>{
    if(e.target.closest('#wiz-next')){save();step++;paint();if(step===3)runProgress();}
    else if(e.target.closest('#wiz-prev')){step--;paint();}
    else if(e.target.closest('#wiz-go')){save();step++;paint();runProgress();}
    else if(e.target.closest('#wiz-done')){s.publishing=null;closeModal();renderDetail();toast('发布成功 v'+nextVer);}
  });
  $('#wiz-body').addEventListener('click',e=>{const r=e.target.closest('[data-org]');if(!r)return;orgId=r.dataset.org;$$('#wiz-body .org-row').forEach(x=>x.classList.remove('active'));r.classList.add('active');});
  function save(){if(step===0){const n=$('#pw-name')?.value.trim(),d=$('#pw-desc')?.value;if(n)s.extension.name=n;if(d!==undefined)s.extension.desc=d;}if(step===2){const t=$('#pw-note')?.value;if(t!==undefined)note=t;}}
  function runProgress(){s.publishing=true;let i=0;const t=setInterval(()=>{const lis=$$('#ps li');const fill=$('#pf');if(!lis.length){clearInterval(t);return;}if(i<lis.length){lis[i].classList.remove('active');lis[i].classList.add('done');i++;if(i<lis.length)lis[i].classList.add('active');if(fill)fill.style.width=(i/lis.length*100)+'%';}else{clearInterval(t);commit();step++;paint();}},800);}
  function commit(){const eff=effCaps(s);s.publishedVersions.unshift({version:nextVer,name:s.extension.name,desc:s.extension.desc+(note?(' · '+note):''),items:eff.map(c=>{const m=masterOf(c.capId);return {type:m.type,name:m.name};}),at:new Date().toISOString().slice(0,16).replace('T',' '),status:'已发布',org:ORGS.find(o=>o.id===orgId).name});}
}
function history(s){
  if(!s.publishedVersions.length)return '<div class="empty" style="margin:0;border:0;padding:6px 0">暂无发布历史</div>';
  return s.publishedVersions.map(v=>`<div class="hist-row"><span class="hist-ver">v${esc(v.version)}</span><div style="flex:1;min-width:0"><div class="hist-name">${esc(v.name)}</div>${v.desc?`<div class="hist-note">${esc(v.desc)}</div>`:''}<div class="hist-items" style="margin-top:3px">${v.items.map(it=>`<span class="hchip">${TYPE[it.type].s} ${esc(it.name)}</span>`).join('')}</div></div>${v.org?`<span class="hist-org">${esc(v.org)}</span>`:''}<span class="hist-at">${esc(v.at)}</span><span class="hist-st">${esc(v.status)}</span></div>`).join('');
}

/* ---------- 添加能力（写回规划表：选 cap + 选活动） ---------- */
function openPicker(s){
  const parents=ACTIVITY_DICT.map(g=>g.p);
  const selset=new Set();let kw='',t='';
  openModal('<div class="modal lg"><div class="modal-head"><h3>添加能力到「'+esc(s.name)+'」</h3><button class="x-btn" data-close>×</button></div><div class="modal-body">'+
    '<p class="note" style="margin-bottom:10px">必须先选父活动才能关联能力。默认加载本产品能力；输入关键词可模糊搜索全部（含其他产品/部门）实现共享。选中后挂到下方所选活动，写回规划表。</p>'+
    '<div style="display:flex;gap:8px;margin-bottom:10px"><div class="field" style="flex:1"><span>父活动 *</span><select id="pk-actp"><option value="">请选择父活动</option>'+parents.map(p=>'<option value="'+esc(p)+'">'+esc(p)+'</option>').join('')+'</select></div>'+
    '<div class="field" style="flex:1"><span>子活动</span><select id="pk-actc"><option value="">（不绑子活动）</option></select></div></div>'+
    '<div class="tools"><div class="search">'+icoSearch+'<input id="pk-kw" placeholder="默认本产品；输入关键词模糊搜索全部"/></div><label class="ctr">类型 <select id="pk-type"><option value="">全部</option>'+['skill','command','agent'].map(x=>'<option value="'+x+'">'+TYPE[x].n+'</option>').join('')+'</select></label></div>'+
    '<div id="pk-list" style="max-height:280px;overflow:auto"></div>'+
    '</div><div class="modal-foot"><button class="btn btn-ghost" data-close>取消</button><button class="btn btn-primary" id="pk-ok">添加选中</button></div></div>');
  function paintChildren(p){const g=ACTIVITY_DICT.find(x=>x.p===p);$('#pk-actc').innerHTML='<option value="">（不绑子活动）</option>'+(g?g.c.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join(''): '');}
  function paintList(){
    let list=kw?LIBRARY.filter(m=>(m.name+m.desc).toLowerCase().includes(kw.toLowerCase())):LIBRARY.filter(m=>m.productId===s.productId);
    if(t)list=list.filter(m=>m.type===t);
    $('#pk-list').innerHTML=list.length?list.map(m=>capRowHTML(m,{multi:true,checked:selset.has(m.id),cur:s.productId})).join(''):'<div class="empty-mini">无匹配能力</div>';
  }
  $('#pk-actp').onchange=e=>{paintChildren(e.target.value);};
  $('#pk-kw').oninput=e=>{kw=e.target.value;paintList();};
  $('#pk-type').onchange=e=>{t=e.target.value;paintList();};
  $('#pk-list').onclick=e=>{const l=e.target.closest('[data-cap]');if(!l)return;const id=l.dataset.cap;if(selset.has(id))selset.delete(id);else selset.add(id);paintList();};
  paintList();
  $('#pk-ok').onclick=()=>{const actp=$('#pk-actp').value,actc=$('#pk-actc').value;if(!actp){toast('请先选择父活动');return;}if(!selset.size){toast('请选择能力');return;}forkExt(s);const eff=effCaps(s);let n=0;selset.forEach(id=>{if(!eff.some(c=>c.capId===id&&c.activity===actp&&c.subActivity===actc)){eff.push({capId:id,activity:actp,subActivity:actc});n++;}});closeModal();renderDetail();toast('已添加 '+n+' 个能力到「'+actp+(actc?' / '+actc:'')+'」（Extension 自有配置）');};
}

/* ---------- modal 基础（可层叠） ---------- */
function openModal(html){const root=$('#modal-root');const ov=document.createElement('div');ov.className='overlay';ov.innerHTML=html;root.appendChild(ov);ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-close]'))closeModal();});return ov;}
function closeModal(){const root=$('#modal-root');if(root.lastChild)root.removeChild(root.lastChild);}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

render();
</script>
</body>
